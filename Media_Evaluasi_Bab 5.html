<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Penjaga Pilar 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="author" content="Rafi Ahlina Majid">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/*
  Penjaga Pilar 3D v1.0 · © 2026 Rafi Ahlina Majid. Hak cipta dilindungi undang-undang.
  Layout: dunia kotak-kotak WebGL2 memenuhi layar; HUD kaca zamrud di sudut, lembar ujian di tengah.
  Satu tampilan gelap zamrud-emas yang disengaja, diturunkan dari Penjaga Pilar versi kelas.
*/
:root{
  color-scheme:dark;
  --night:#06140F; --panel:#0E241D; --panel2:#153328; --line:#244D40; --line2:#376B59;
  --text:#F4EFE2; --muted:#B4CFC3; --dim:#7E9C90;
  --amber:#E9B949; --amber2:#C9922B; --amber-ink:#2A1C02; --teal:#43B3AE; --rose:#F08A78; --green:#7FDDA4; --violet:#A98BEA;
  --parch:#EBDDB4; --ink:#33260F;
  --g-mizan:#F4D27A; --g-din:#3FBF7F; --g-nafs:#F07A6A; --g-aql:#6FA8FF; --g-nasl:#B88CF0; --g-mal:#F2B53C;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,"Segoe UI",Roboto,sans-serif;
  --arabic:"Amiri","Traditional Arabic","Noto Naskh Arabic",FreeSerif,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--night)}
body{background:var(--night);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.55;overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--night)}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-weight:700;font-size:.95rem;padding:.65rem 1.15rem;border-radius:12px;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--amber)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.amber:hover:not(:disabled){background:#F2CB6A}
.btn.ghost{background:transparent}
.btn.sm{padding:.45rem .8rem;font-size:.85rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kick{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);font-weight:800}

/* HUD */
.hud{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100% - 24px)}
.hud-card{background:rgba(14,36,29,.86);border:1px solid var(--line);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:7px;min-width:220px}
.hud-title{font-family:var(--display);font-size:1.15rem;color:var(--amber);line-height:1}
.oil{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.oil .bar{height:8px;border-radius:4px;background:#163C33;overflow:hidden}
.oil .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--amber2),var(--amber));border-radius:4px;transition:width .3s}
.oil.low .bar i{background:linear-gradient(90deg,#B4442F,var(--rose))}
.oil b{font-variant-numeric:tabular-nums;color:var(--text)}
.pages{display:flex;gap:4px;align-items:center}
.pg{width:18px;height:22px;border-radius:3px;border:1.5px solid var(--line2);background:transparent}
.pg.got{background:linear-gradient(160deg,#F3E2B6,#D7B676);border-color:var(--amber)}
.pg.fin{border-style:dashed;border-color:var(--violet)}
.pg.fin.got{background:var(--violet);border-style:solid}
.hud-row{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--muted)}
.hud-row b{color:var(--text);font-variant-numeric:tabular-nums}
.tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:6px}
.tools .btn{background:rgba(14,36,29,.86)}
#mini{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:240px;height:94px;border:1px solid var(--line2);border-radius:10px;background:rgba(6,20,15,.85);cursor:pointer}
.guru{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:min(460px,calc(100% - 280px));background:rgba(14,36,29,.92);border:1px solid var(--amber2);border-radius:14px;padding:10px 14px 11px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.guru .lamp{width:26px;height:26px;flex:none;margin-top:2px}
.guru b{display:block;font-family:var(--display);color:var(--amber);font-size:.95rem}
.guru p{font-size:.92rem}
.guru button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:1.1rem;line-height:1;padding:2px 4px;margin-left:auto}

/* Lapisan layar */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:radial-gradient(60% 60% at 50% 45%,rgba(6,20,15,.55),rgba(6,20,15,.92));overflow:auto}
.sheet{width:min(820px,100%);max-height:100%;overflow:auto;background:linear-gradient(170deg,var(--panel2),var(--panel));border:1px solid var(--line2);border-radius:20px;padding:clamp(18px,3vw,32px);display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.sheet.narrow{width:min(560px,100%)}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-head h2{font-size:clamp(1.5rem,1.2rem + 1.2vw,2.2rem)}
.close{background:none;border:1px solid var(--line2);border-radius:10px;color:var(--muted);padding:.35rem .7rem;cursor:pointer;font-weight:700;font-size:.85rem;flex:none}
.title-screen{text-align:center;align-items:center}
.title-screen h1{font-size:clamp(2.6rem,1.6rem + 5vw,5rem);color:var(--amber);text-shadow:0 0 40px rgba(233,185,73,.35)}
.title-screen .sub{color:var(--muted);max-width:52ch;font-size:1.05rem}
.title-screen .ctas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.how{text-align:left;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.how div{background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.9rem;color:var(--muted)}
.how b{display:block;color:var(--text);font-family:var(--display);font-size:1.05rem;margin-bottom:2px}
.prolog{min-height:120px;font-size:clamp(1.1rem,1rem + .5vw,1.35rem);line-height:1.6}
.prolog-dots{display:flex;gap:6px;justify-content:center}
.prolog-dots i{width:28px;height:5px;border-radius:3px;background:var(--line2)}
.prolog-dots i.on{background:var(--amber)}

/* Kartu gulungan & gerbang */
.scroll-card{background:linear-gradient(175deg,#EADBB4,#D9C38F);color:var(--ink);border-radius:14px;padding:18px 20px;position:relative;box-shadow:inset 0 0 0 1px rgba(58,42,24,.25)}
.scroll-card::before,.scroll-card::after{content:"";position:absolute;left:-6px;right:-6px;height:14px;border-radius:7px;background:linear-gradient(#C9AE73,#A98B4F)}
.scroll-card::before{top:-7px}.scroll-card::after{bottom:-7px}
.scroll-card h3{font-size:1.6rem;color:#2A1C0E}
.scroll-card .masa{font-family:var(--display);color:#6B4F2A;font-weight:600}
.scroll-card p.isi{margin-top:8px;font-size:1rem}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.9rem;margin-top:10px}
.kv dt{color:#7A5F3A;font-weight:700}
.kv dd{margin:0}
.gate-badge{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--amber)}
.lore{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.95rem;color:var(--muted)}
.task{font-size:1.05rem}
.stars{display:flex;gap:4px;font-size:1.6rem;line-height:1;color:var(--line2)}
.stars .on{color:var(--amber);text-shadow:0 0 12px rgba(233,185,73,.6)}
.page-card{background:linear-gradient(160deg,#F1E2BB,#D9BD80);color:var(--ink);border-radius:12px;padding:16px 18px;font-family:var(--display);font-size:1.15rem;line-height:1.45}
.fb{border-radius:12px;padding:10px 12px;font-size:.95rem}
.fb.ok{background:rgba(116,211,148,.14)}
.fb.bad{background:rgba(238,106,90,.13)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line2);background:rgba(0,0,0,.2);border-radius:12px;padding:.65rem .85rem;cursor:pointer;width:100%;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--amber)}
.opt .L{font-family:var(--display);width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--panel2);color:var(--amber)}
.opt.right{border-color:var(--green);background:rgba(116,211,148,.14)}
.opt.wrong{border-color:var(--rose);background:rgba(238,106,90,.12)}
.opt:disabled{cursor:default}

/* Gerbang 1: ayat */
.verse{display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:8px;justify-content:flex-start;background:rgba(0,0,0,.25);border:1px dashed var(--line2);border-radius:14px;padding:12px;min-height:72px}
.slot{min-width:90px;min-height:52px;border-radius:10px;border:1.5px dashed var(--line2);display:grid;place-items:center;font-family:var(--arabic);font-size:1.6rem;padding:0 10px;direction:rtl;color:var(--amber)}
.slot.filled{border-style:solid;border-color:var(--amber2);background:rgba(233,185,73,.08)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.frag{font-family:var(--arabic);font-size:1.6rem;direction:rtl;border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:.25rem .9rem;cursor:pointer;line-height:1.9}
.frag:hover{border-color:var(--amber)}
/* Pasangan */
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 16px}
.pairs .col{display:flex;flex-direction:column;gap:8px}
.pcard{text-align:left;border:1px solid var(--line2);background:rgba(0,0,0,.22);border-radius:12px;padding:.65rem .8rem;cursor:pointer;font-weight:700;min-height:48px}
.pcard i{font-style:italic;font-weight:600}
.pcard:hover:not(:disabled){border-color:var(--amber)}
.pcard.sel{border-color:var(--teal);background:rgba(67,179,174,.15)}
.pcard.done{border-color:var(--green);background:rgba(116,211,148,.12);cursor:default}
.pcard .tag{display:inline-block;font-size:.72rem;color:var(--green);margin-left:6px}
/* Lengkung Cordoba */
.arches{display:block;width:100%;height:auto}
.arch-q{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.arch-word{font-family:var(--arabic);font-size:clamp(2.2rem,1.6rem + 2vw,3.2rem);direction:rtl;color:var(--amber);background:rgba(0,0,0,.25);border-radius:14px;padding:4px 18px;text-align:center;min-width:150px}
/* Pintu waktu */
.tslots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tslot{border:1.5px dashed var(--line2);border-radius:12px;min-height:86px;padding:8px;font-size:.8rem;display:flex;flex-direction:column;gap:4px;justify-content:center;text-align:center}
.tslot b{font-family:var(--display);font-size:1.3rem;color:var(--amber);line-height:1}
.tslot.filled{border-style:solid;border-color:var(--amber2);background:rgba(233,185,73,.07)}
.tpool{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tev{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:.6rem .7rem;cursor:pointer;font-weight:700;font-size:.9rem;text-align:left}
.tev:hover{border-color:var(--amber)}
/* Kafilah & kabut */
.dunes,.fogscene{display:block;width:100%;height:auto;border-radius:14px}
.fogscene{background:#120F1C}
.fcard{background:rgba(0,0,0,.25);border:1px solid var(--line2);border-radius:14px;padding:16px 18px}
.fcard p.t{font-family:var(--display);font-size:clamp(1.2rem,1rem + .7vw,1.5rem)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* Jurnal */
.jlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.jitem{background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.88rem;color:var(--muted)}
.jitem b{display:block;color:var(--text);font-family:var(--display);font-size:1.02rem}
.jitem.locked{opacity:.45}
.end-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.end-stats div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:12px}
.end-stats b{display:block;font-family:var(--display);font-size:1.8rem;color:var(--amber);font-variant-numeric:tabular-nums}
.end-stats span{font-size:.82rem;color:var(--muted)}
input[type=text]{border:1px solid var(--line2);background:rgba(0,0,0,.25);border-radius:12px;padding:.65rem .85rem;width:100%}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:30;background:var(--amber);color:var(--amber-ink);font-weight:800;padding:.6rem 1.1rem;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.credit{font-size:.78rem;color:var(--dim)}
.wm{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-size:.72rem;color:rgba(244,237,224,.55);pointer-events:none;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.8)}
.idt{display:grid;grid-template-columns:170px minmax(0,1fr);text-align:left;width:100%;border-top:1px solid var(--line)}
.idt dt,.idt dd{margin:0;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.92rem}
.idt dt{color:var(--dim)}

@media (max-width:760px){
  .hud-card{min-width:0;padding:8px 10px}
  .hud-title{font-size:1rem}
  #mini{width:150px;height:59px}
  .wm{left:max(12px,env(safe-area-inset-left,0px));transform:none;font-size:.66rem}
  .idt{grid-template-columns:minmax(0,1fr)}
  .idt dt{border-bottom:0;padding-bottom:0}
  .guru{max-width:calc(100% - 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 80px)}
  .how{grid-template-columns:minmax(0,1fr)}
  .tools .btn span{display:none}
  .tslots{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tpool{grid-template-columns:repeat(2,minmax(0,1fr))}
  .end-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arch-q{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){ .pairs{grid-template-columns:minmax(0,1fr)} .choose{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
/* ===== Lapisan 3D (menimpa gaya dasar 2D bila perlu) ===== */
[hidden]{display:none!important}
html,body{margin:0;overscroll-behavior:none}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:#06140F}
#gl.dragging{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.tag{position:absolute;left:0;top:0;padding:3px 10px;border-radius:999px;background:rgba(6,20,15,.74);color:var(--text);font-weight:800;font-size:.78rem;white-space:nowrap;border:1px solid rgba(255,255,255,.16);will-change:transform;display:flex;align-items:center}
.tag.bad{background:rgba(110,22,58,.86);border-color:rgba(238,106,90,.7)}
.tag.sign{background:rgba(58,42,24,.88);color:#F3E2B6;font-size:.72rem;border-color:rgba(243,226,182,.35)}
.qm{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--amber);color:var(--amber-ink);font-style:normal;font-weight:900;margin-right:6px;font-size:.78rem;flex:none}
#hurt{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0}
#hurt.on{animation:hurt .65s ease-out}
@keyframes hurt{0%{opacity:1;box-shadow:inset 0 0 150px 46px rgba(238,106,90,.7)}100%{opacity:0;box-shadow:inset 0 0 150px 46px rgba(238,106,90,.7)}}

#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.hud-l{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;display:flex;flex-direction:column;gap:8px;width:min(300px,calc(100vw - 176px))}
.hud-l .hud-card{min-width:0}
.hud-r{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.hud-r .tools{position:static;display:flex;gap:6px;pointer-events:auto}
.hud-r .tools .btn{background:rgba(14,36,29,.88)}
#mini{position:static;width:128px;height:128px;border-radius:50%;border:2px solid rgba(233,185,73,.6);background:#16365a;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.oil svg{width:18px;height:18px}
.obj{position:absolute;left:50%;top:12px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(14,36,29,.88);border:1px solid var(--amber2);border-radius:999px;padding:6px 16px 6px 8px;width:max-content;max-width:min(500px,calc(100vw - 500px));min-width:200px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#objArrow{width:32px;height:32px;flex:none;transition:transform .1s linear}
.obj span{display:block;font-weight:800;font-size:.86rem;line-height:1.25}
.obj small{display:block;color:var(--amber);font-weight:800;font-size:.72rem}
.msg{display:flex;gap:10px;align-items:flex-start;background:rgba(14,36,29,.94);border:1px solid var(--violet);border-radius:14px;padding:10px 12px;pointer-events:auto}
.msg.in{animation:msgIn .35s ease-out}
@keyframes msgIn{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}
.msg b{display:block;font-family:var(--display);color:var(--violet);font-size:.95rem}
.msg p{font-size:.86rem;line-height:1.4}
.port{width:48px;height:48px;image-rendering:pixelated;border-radius:10px;border:2px solid var(--amber2);background:#163C33;flex:none}
.port.big{width:72px;height:72px}
.prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(6,20,15,.84);border:1px solid var(--amber2);border-radius:999px;padding:8px 16px;font-weight:700;z-index:6;pointer-events:none;white-space:nowrap}
.prompt b{color:var(--amber)}

function face(name, skin, opt = {}) {
  tile(name, (P) => {
    const S = C(skin), dark = mulc(S, 0.62), brow = C(opt.brow || "#3A2416");
    P.fill(S, 0.04);
    if (opt.hijab) { const H = C(opt.hijab); for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const inside = x >= 3 && x <= 12 && y >= 3 && y <= 14 && !((x === 3 || x === 12) && (y === 3 || y === 14)); if (!inside) P.set(x, y, mulc(H, 0.95 + P.R() * 0.08)); } }
    if (opt.hair) { const Hc = C(opt.hair); for (let x = 0; x < 16; x++) for (let y = 0; y < 3; y++) P.set(x, y, Hc); P.set(0, 3, Hc); P.set(15, 3, Hc); }
    [[4, 6], [10, 6]].forEach(([x, y]) => { P.set(x, y, brow); P.set(x + 1, y, brow); });
    [[4, 7], [10, 7]].forEach(([x, y]) => { P.set(x, y, C("#FFFFFF")); P.set(x + 1, y, C(opt.eye || "#2A1B12")); P.set(x, y + 1, C("#FFFFFF")); P.set(x + 1, y + 1, C(opt.eye || "#2A1B12")); });
    P.set(7, 9, dark); P.set(8, 9, dark); P.set(7, 10, mulc(S, 0.8)); P.set(8, 10, mulc(S, 0.8));
    if (opt.beard) { const Bd = C(opt.beard); for (let y = 10; y < 16; y++) for (let x = 2; x < 14; x++) { if (y < 12 && x > 4 && x < 11) continue; P.set(x, y, mulc(Bd, 0.92 + P.R() * 0.14)); } }
    const mc = opt.beard ? mulc(C(opt.beard), 0.55) : C("#7A3B2E");
    for (let x = 6; x < 10; x++) P.set(x, 12, mc);
    if (opt.smile) { P.set(5, 11, mc); P.set(10, 11, mc); }
  });
}

  const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz;

function genWorld() {
  const { W, D, H, SEA } = WORLD, N = W * D;
  const hm = new Int16Array(N), bio = new Uint8Array(N), reg = new Int8Array(N).fill(-1), coast = new Uint8Array(N);
  const vox = new Uint8Array(N * H);
  Object.assign(WORLD, { hm, bio, reg, vox, kab: new Uint8Array(N).fill(255), res: new Uint8Array(N), spots: { gates: {}, beacons: [], npcs: {}, scrolls: {}, items: [], signs: [], braziers: [], hoax: [], seals: {}, pillars: {}, minis: {} } });
  /* 1. medan alami */
  for (let z = 0; z < D; z++) for (let x = 0; x < W; x++) {
    const i = z * W + x;
    let best = -9, bi = -1, bu = 1;
    for (let k = 0; k < REG.length; k++) {
      const r = REG[k], d = Math.hypot(x - r.x, z - r.z);
      if (d > r.r * 1.6) continue;
      const n = (fbm(x * 0.07 + k * 13.1, z * 0.07, 11) - 0.5) * r.r * 0.5;
      const L = 1 - (d + n) / r.r;
      if (L > best) { best = L; bi = k; bu = d / r.r; }
    }
    let b = bi >= 0 ? REG[bi].bio : 0, Lr = best;
    for (const [a, c, w, bb] of ISTH) {
      const d = segDist(x, z, a[0], a[1], c[0], c[1]); if (d > w * 1.8) continue;
      const L = 1 - (d + (fbm(x * 0.09, z * 0.09, 29) - 0.5) * w * 0.7) / w;
      if (L > best) { best = L; if (L > Lr + 0.05) { b = bb; bu = 0.5; } }
    }
    reg[i] = best > 0 ? bi : -1;
    if (best <= 0) { hm[i] = SEA + 1 - Math.min(5, Math.ceil(-best * 14 + 0.01)); bio[i] = 0; continue; }
    const f = fbm(x * 0.06, z * 0.06, 5), ramp = smooth(0, 0.25, best);
    let e;
    switch (b) {
      case 1: e = 2 + smooth(0.42, 0.82, bu) * (4 + 8 * fbm(x * 0.09, z * 0.09, 6)); break;
      case 2: e = 1.6 + 1.6 * f; break;
      case 4: e = 1.5 + 2.4 * f; break;
      case 5: e = 1.4 + 3.4 * (0.5 + 0.5 * Math.sin(x * 0.23 + z * 0.08 + fbm(x * 0.05, z * 0.05, 7) * 6)) * (0.35 + f); break;
      case 6: e = 1.5 + 3 * f; break;
      case 7: e = 2 + 2.4 * f; break;
      case 8: e = 1.5 + 2.2 * f; break;

    }
    hm[i] = SEA + 1 + Math.round(ramp * e); bio[i] = b; coast[i] = best < 0.12 ? 1 : 0;
  }
  /* 3. pelataran datar */
  for (const [cx, cz, r, h] of PLAZAS) for (let z = Math.max(0, cz - r - 6); z < Math.min(D, cz + r + 7); z++) for (let x = Math.max(0, cx - r - 6); x < Math.min(W, cx + r + 7); x++) {
    const i = z * W + x, d = Math.hypot(x - cx, z - cz); if (d > r + 6) continue;
    const t = 1 - smooth(r, r + 6, d);
    if (!bio[i] && t < 0.98) continue;

const gateFrame = (g, inner) => `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gT"><div class="sheet-head"><div><span class="gate-badge" style="color:${g.c}">Gerbang ${g.n} · ${g.place}</span><h2 id="gT">${g.name}</h2></div><button class="close" type="button" data-close>Keluar</button></div>${inner}</div>`;
function runGate(g) {
  if (g.type === "ayat") return runAyat(g);
  if (g.type === "match") return runMatch(g);
  if (g.type === "menara") return runSeq(g, pickN(MENARA, 5).map(qMenara), visMenara);
  if (g.type === "darurat") return runSeq(g, pickN(DARURAT, 4).map(qDarurat), visHeart);
  if (g.type === "sidang") return runSeq(g, pickN(SIDANG, 6).map(qSidang), (r, n) => visRow(r, n, "doc"));
  if (g.type === "timbang") return runSeq(g, pickN(TIMBANG, 6).map(qTimbang), (r, n) => visRow(r, n, "coin"));
}
function runSeq(g, qs, vis) {
  const st = { i: 0, m: 0, res: [] };
  openModal(gateFrame(g, `<div id="gvis"></div><p class="muted small" id="gprog"></p><div id="qhost"></div>`), { onClose: stopQT });
  const step = () => {
    $("#gvis").innerHTML = vis(st.res, qs.length);
    if (st.i >= qs.length) { $("#gprog").textContent = "Semua soal terjawab."; $("#qhost").innerHTML = ""; setTimeout(() => finishGate(g, st.m), 650); return; }
    $("#gprog").textContent = `Soal ${st.i + 1} dari ${qs.length}`;
    askQ($("#qhost"), qs[st.i], (ok) => { st.res.push(ok); if (!ok) st.m++; st.i++; step(); },
      { nextLabel: st.i === qs.length - 1 ? "Selesaikan" : "Soal berikutnya", onAnswer: (ok) => { $("#gvis").innerHTML = vis(st.res.concat([ok]), qs.length); } });
  };
  step();
}
function runAyat(g) {
  let m = 0, next = 0;
  openModal(gateFrame(g, `${turnLine()}<p class="task">${g.task}</p><div class="verse" id="verse">${FRAGS.map(() => `<span class="slot"></span>`).join("")}</div><div class="pool" id="pool"></div><div id="fb" aria-live="polite"></div>`), { onClose: stopQT });
  shuffle(FRAGS.map((f, i) => i)).forEach((i) => {
    const b = el("button", "frag", FRAGS[i]); b.type = "button"; b.lang = "ar";
    b.addEventListener("click", () => {
      if (i !== next) { m++; sfx("bad"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; }
      const sl = $("#verse").children[next]; sl.textContent = FRAGS[i]; sl.classList.add("filled"); b.remove(); next++; sfx("ok");
      if (next < FRAGS.length) return;
      const pts = scoreRound([["sumber", m <= 1]], m); passTurn();
      $("#fb").innerHTML = `<div class="fb ok"><b>Ayat utuh kembali. +${pts} poin</b><p>“${AYAT_TR}”</p></div><div id="qhost"></div>`;
      const opts = shuffle([["a", "Kepada Allah (Al-Qur'an) dan Rasul (Sunnah)"], ["b", "Kepada suara terbanyak di antara kita"], ["c", "Kepada kebiasaan nenek moyang"]]).map(([k, t]) => ({ k, t }));
      askQ($("#qhost"), { text: "Menurut ayat ini, ke mana kita mengembalikan perkara saat berbeda pendapat?", kind: "txt", opts, ans: "a", tag: "sumber", lim: 20, why: "QS an-Nisa'/4:59 memerintahkan agar perselisihan dikembalikan kepada Allah (Al-Qur'an) dan Rasul (Sunnah). Itulah dasar urutan sumber hukum Islam." },
        (ok) => { if (!ok) m++; finishGate(g, m); }, { nextLabel: "Buka gerbang" });
    });
    $("#pool").append(b);
  });
}
function runMatch(g) {
  let round = 0, totalM = 0;
  const rounds = [
    { title: "Ronde 1 · Pilar dan dalilnya", right: "Dalil", pairs: MATCH_DALIL.map(([k, t, ref]) => [k, `<i>“${t}”</i><small>${ref}</small>`]) },
    { title: "Ronde 2 · Pilar dan cara menjaganya", right: "Cara menjaga", pairs: MATCH_CARA }
  ];
  const play = () => {
    const R = rounds[round];
    openModal(gateFrame(g, `${turnLine()}<p class="task"><b>${R.title}.</b> Pilih satu pilar di kiri, lalu pasangannya di kanan.</p><div class="pairs"><div class="col" id="cL"><span class="kick">Pilar</span></div><div class="col" id="cR"><span class="kick">${R.right}</span></div></div><div id="fb" aria-live="polite"></div>`));
    let sel = null, got = 0, m = 0; const wrongOn = new Set();
    R.pairs.forEach(([k]) => {
      const b = el("button", "pcard pl", `<span class="ar" lang="ar">${PIL[k].ar}</span> ${PIL[k].id}`); b.type = "button"; b.dataset.k = k; b.style.setProperty("--pc", PIL[k].c);
      b.addEventListener("click", () => { if (b.classList.contains("done")) return; $("#cL").querySelectorAll(".pcard").forEach((x) => x.classList.remove("sel")); b.classList.add("sel"); sel = k; });
      $("#cL").append(b);
    });
    shuffle(R.pairs).forEach(([k, t]) => {
      const b = el("button", "pcard", t); b.type = "button"; b.dataset.k = k;
      b.addEventListener("click", () => {
        if (b.classList.contains("done")) return;
        if (sel == null) { $("#fb").innerHTML = `<p class="fb bad">Pilih dulu pilar di kolom kiri.</p>`; return; }
        if (sel !== k) { m++; wrongOn.add(sel); sfx("bad"); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); $("#fb").innerHTML = `<p class="fb bad">Belum cocok. Coba pasangan lain.</p>`; return; }
        const L = $("#cL").querySelector(`[data-k="${k}"]`); [L, b].forEach((x) => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
        b.insertAdjacentHTML("beforeend", `<span class="tag2">✓</span>`); sel = null; got++; sfx("ok"); $("#fb").innerHTML = "";
        if (got < R.pairs.length) return;
        const pts = scoreRound(R.pairs.map(([kk]) => [kk, !wrongOn.has(kk)]), m); totalM += m; passTurn();
        $("#fb").innerHTML = `<p class="fb ok"><b>Semua pasangan tepat. +${pts} poin</b></p><button class="btn amber" type="button" id="mNext">${round === 0 ? "Ronde berikutnya" : "Buka gerbang"}</button>`;
        $("#mNext").addEventListener("click", () => { round++; if (round < rounds.length) play(); else finishGate(g, totalM); });
        if (!isTouch()) $("#mNext").focus();
      });
      $("#cR").append(b);
    });
  };
  play();
}
function finishGate(g, mistakes) {
  stopQT();

/* ---------- tantangan Pembisik Mafsadat (Tangkap Pilar) ---------- */
function openPembisik(h) {
  let right = 0; const used = [];
  const pick = () => {
    let pool = CASES.map((c, i) => i).filter((i) => !S.seen.includes(i) && !used.includes(i));
    if (pool.length < 2) { S.seen = []; pool = CASES.map((c, i) => i).filter((i) => !used.includes(i)); }
    const i = pool[(Math.random() * pool.length) | 0]; used.push(i); S.seen.push(i); return i;
  };
  openModal(`<div class="sheet narrow hoax" role="dialog" aria-modal="true" aria-labelledby="hT">
    <div class="sheet-head"><div><span class="gate-badge" style="color:var(--rose)">Pembisik Mafsadat · ${HOAX_SPOTS[h.key] || "Jalan"}</span><h2 id="hT">“Ssst… ini kan tidak apa-apa?”</h2></div><button class="close" type="button" data-close>Mundur</button></div>
    <p class="muted small">Tunjukkan pilar yang ingin ia rusak. Dua jawaban tepat akan mengusirnya.</p>
    <div id="qhost"></div><div class="dots" id="hDots"></div></div>`, { onClose: () => { stopQT(); } });
  const dots = () => { $("#hDots").innerHTML = [0, 1].map((k) => `<i class="${k < right ? "on" : ""}"></i>`).join("") + `<span class="muted small">Tepat ${right} dari 2</span>`; };
  const ask = () => {
    dots(); const i = pick();
    askQ($("#qhost"), qCase(i), () => { if (right >= 2) { closeModal(true); beatHoax(h); } else ask(); }, {
      nextLabel: "Kasus berikutnya",
      onAnswer: (ok) => {
        if (ok) right++; else { S.oil = Math.max(0, S.oil - 8); hud(); }
        if (!S.cases.includes(i)) S.cases.push(i);
        dots(); const nb = $("#qNext"); if (nb && right >= 2) nb.textContent = "Usir Pembisik!"; save();
      }
    });
  };
  ask();
}

/* ================= SUARA (WebAudio, tanpa berkas) ================= */
const AU = { ctx: null, master: null, mus: null, next: 0, drone: null };
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === "suspended") AU.ctx.resume().catch(() => {}); return; }
  try {
    AU.ctx = new (window.AudioContext || window.webkitAudioContext)();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.55; AU.master.connect(AU.ctx.destination);
    AU.mus = AU.ctx.createGain(); AU.mus.gain.value = 0; AU.mus.connect(AU.master);
  } catch (e) { AU.ctx = null; }
}
function tone(f, dur, type, vol, f2, delay, dest) {
  const c = AU.ctx; if (!c) return; const t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain(); o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || AU.master); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, freq, q, delay) {
  const c = AU.ctx; if (!c) return; const t = c.currentTime + (delay || 0);
  const len = Math.max(1, Math.floor(c.sampleRate * dur)), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq || 800; f.Q.value = q || 0.8;
  const g = c.createGain(); g.gain.value = vol || 0.2; s.connect(f); f.connect(g); g.connect(AU.master); s.start(t);
}
function sfx(k) {
  if (!AU.ctx || !G.set.snd) return;
  switch (k) {
    case "step": noise(0.06, 0.05, 420 + Math.random() * 200, 1.2); break;
    case "jump": tone(320, 0.16, "square", 0.05, 520); break;
    case "jump2": tone(520, 0.14, "triangle", 0.08, 1040); tone(1320, 0.12, "sine", 0.05, null, 0.06); break;
    case "land": noise(0.08, 0.08, 260, 1); break;
    case "ok": tone(660, 0.12, "triangle", 0.16); tone(990, 0.18, "triangle", 0.14, null, 0.08); break;
    case "bad": tone(220, 0.22, "sawtooth", 0.07, 140); break;
    case "scroll": tone(523, 0.14, "triangle", 0.14); tone(659, 0.14, "triangle", 0.12, null, 0.09); tone(784, 0.26, "triangle", 0.12, null, 0.18); break;
    case "page": [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.4, "triangle", 0.13, null, i * 0.11)); break;
    case "burst": noise(0.35, 0.16, 1400, 0.6); tone(880, 0.3, "sine", 0.1, 1760); break;
    case "hit": tone(180, 0.14, "square", 0.08, 90); noise(0.1, 0.1, 600); break;
    case "hurt": tone(160, 0.3, "sawtooth", 0.09, 80); break;
    case "pop": tone(740, 0.08, "sine", 0.12, 1200); break;
    case "talk": tone(380 + Math.random() * 120, 0.05, "square", 0.025); break;
    case "light": noise(0.5, 0.12, 900, 0.5); tone(392, 0.5, "triangle", 0.1, 784); break;
    case "dissolve": noise(0.6, 0.12, 300, 0.7); tone(300, 0.5, "sine", 0.08, 90); break;
    case "boss": tone(70, 1.2, "sawtooth", 0.12, 50); noise(1, 0.08, 120, 0.5); break;
    case "tp": tone(300, 0.5, "sine", 0.1, 1200); break;
  }
}
const HIJAZ = [0, 1, 4, 5, 7, 8, 10, 12, 13, 16];
function musicTick() {
  if (!AU.ctx) return;
  const on = G.set.snd && G.set.mus && G.mode !== "loading";
  const target = on ? 0.32 : 0;
  AU.mus.gain.setTargetAtTime(target, AU.ctx.currentTime, 0.8);
  if (!on) return;
  if (!AU.drone) {
    AU.drone = [146.83, 220].map((f) => { const o = AU.ctx.createOscillator(), g = AU.ctx.createGain(); o.type = "sine"; o.frequency.value = f; g.gain.value = 0.035; o.connect(g); g.connect(AU.mus); o.start(); return o; });
  }
  const now = AU.ctx.currentTime;
  if (now < AU.next) return;
  const tense = G.boss && G.boss.active;
  const base = 293.66 * (tense ? 0.5 : 1), st = HIJAZ[(Math.random() * HIJAZ.length) | 0];
  tone(base * Math.pow(2, st / 12), tense ? 0.5 : 1.2, "triangle", 0.05, null, 0, AU.mus);
  if (Math.random() < 0.3) tone(base * Math.pow(2, HIJAZ[(Math.random() * 5) | 0] / 12) / 2, 1.6, "sine", 0.04, null, 0.2, AU.mus);
  AU.next = now + (tense ? 0.32 : 0.55 + Math.random() * 0.9);
}

      it.life -= dt; if (it.life <= 0) { G.items.splice(i, 1); continue; }
      if (d < 3.5) { const k = 6 * dt; it.x += (p.x - it.x) * k; it.y += (p.y + 0.5 - it.y) * k; it.z += (p.z - it.z) * k; }
      if (d < 0.9) { G.items.splice(i, 1); S.oil = Math.min(100, S.oil + 4); sfx("pop"); hud(); }
      continue;
    }
    const K = ITEM_KINDS[it.kind]; if (!K) continue;
    if (Math.random() < dt * 3) puff(it.x, it.y + 0.6, it.z, 1, { c: K.c, size: 0.1, sp: 0.6, up: 0.7 });
    if (d < 1.3) {
      G.items.splice(i, 1); S.items.push(it.key); sfx("scroll"); puff(it.x, it.y + 0.6, it.z, 30, { sp: 3, c: K.c, size: 0.16 });
      const n = S.items.filter((x) => x.startsWith(it.kind)).length;
      toast(`${K.name} ${n}/3${S.q[K.rid] ? "" : ` · ${NPCS[QUESTS[K.rid].npc].name} mungkin membutuhkannya`}`);
      checkStep(K.rid); G.objT = 0; save();
    }
  }
}
function updateOil(dt) {
  const p = G.player, k = kabutAt(p.x, p.z);
  G.invul = Math.max(0, G.invul - dt); G.burstCD = Math.max(0, G.burstCD - dt); G.burstFx = Math.max(0, G.burstFx - dt * 3);
  const before = Math.round(S.oil);
  if (k > 0.4 && S.oil > 0) S.oil = Math.max(0, S.oil - dt * 0.32 * k);
  else if (k < 0.2 && S.oil < 60) S.oil = Math.min(60, S.oil + dt * 0.8);
  if (Math.round(S.oil) !== before) hud();
  const base = S.oil > 0 ? 6 + S.oil / 100 * 5 : 3.2;
  G.lampR = base + G.burstFx * 6;
  if (k > 0.5 && Math.random() < dt * 6 * k) { const a = Math.random() * TAU, r = 3 + Math.random() * 7; puff(p.x + Math.cos(a) * r, p.y + Math.random() * 2, p.z + Math.sin(a) * r, 1, { c: [0.42, 0.34, 0.66], add: false, a: 0.35, size: 0.6, sp: 0.2, up: 0.3, life: 2.2 }); }
}

/* ---------- menggambar ---------- */
const SHADOWS = new Float32Array(48);
function lerp3(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
const SKY_A = { top: rgb("#3A3F78"), hor: rgb("#8E86B4"), sun: [0.9, 0.86, 0.95] }, SKY_B = { top: rgb("#4F95E6"), hor: rgb("#CFE3F5"), sun: [1.0, 0.98, 0.93] };
const SUN_D = (() => { const v = [0.42, 0.78, 0.36], l = Math.hypot(...v); return v.map((x) => x / l); })();
function drawScene(dt) {
  const t = G.time, p = G.player, cx = CAM.ex, cz = CAM.ez, far = G.fog[1] + 8;
  const vis = (x, z, r) => Math.abs(x - cx) < far + (r || 0) && Math.abs(z - cz) < far + (r || 0);
  const sh = []; const addSh = (x, y, z, r) => { const d = Math.hypot(x - cx, z - cz); if (d < 30) sh.push([d, x, y, z, r]); };
  if (G.mode === "play" || G.mode === "title") {
    if (G.mode === "play") { p.lampK = S.oil > 0 ? 1 : 0.3; if (CAM.cur > 1.25) drawHumanoid(p, p.spec, t); addSh(p.x, p.ry, p.z, 0.55); }
    for (const n of G.npcs) if (vis(n.x, n.z)) { drawHumanoid(n, NPCS[n.id], t); if (n.mark && G.mode === "play") drawMarker(n.x, n.ry + 2.55, n.z, t, COL.gold); addSh(n.x, n.ry, n.z, 0.55); }
    for (const h of G.hoaxers) if ((h.alive || h.fade > 0) && vis(h.x, h.z)) { if (!h.alive) h.scale = Math.max(0.01, h.fade); drawHumanoid(h, HOAX_SPEC, t); addSh(h.x, h.ry, h.z, 0.55); }
    for (const e of G.shades) if (vis(e.x, e.z)) { drawShade(e, t); if (e.alive) addSh(e.x, e.y - 0.35, e.z, 0.6); }
    for (const it of G.items) if (vis(it.x, it.z)) drawItem(it, t);
    for (const c of G.camels) if (vis(c.x, c.z)) { drawCamel(c, t); addSh(c.x, c.ry, c.z, 0.85); }
    for (const s of G.sheep) if (vis(s.x, s.z)) { drawSheep(s, t); addSh(s.x, s.ry, s.z, 0.5); }
    for (const w of G.warga) if (vis(w.x, w.z)) { drawHumanoid(w, w.spec, t); addSh(w.x, w.ry, w.z, 0.5); }
    for (const s of G.signs) if (vis(s.x, s.z)) drawSign(s);
    for (const b of WORLD.spots.beacons) if (S.beacons.includes(b.id) && vis(b.x, b.z, 40)) { drawFlame(b.x, b.y + 1, b.z, t, 1); if (Math.random() < dt * 8) puff(b.x, b.y + 1.6, b.z, 1, { c: [1, 0.7, 0.3], size: 0.18, sp: 0.6, up: 2.2, life: 1 }); }
    WORLD.spots.braziers.forEach((b, i) => { if (S.br.includes(i) && vis(b.x, b.z)) drawFlame(b.x, b.y, b.z, t, 0.7); });
    for (const g of GATES) if (S.gates[g.k]) {
      const pl = WORLD.spots.pillars[g.k], col = GEMC[g.k];
      if (pl && vis(pl.x, pl.z, 70)) { drawBeam(pl.x, pl.y, pl.z, t, col); if (Math.random() < dt * 5) puff(pl.x + (Math.random() - 0.5) * 1.4, pl.y + Math.random() * 3, pl.z + (Math.random() - 0.5) * 1.4, 1, { c: col, size: 0.22, sp: 0.4, up: 3, drag: 0.3, life: 2 }); }
      const mp = WORLD.spots.minis[g.k]; if (mp && vis(mp.x, mp.z)) drawGemSmall(mp.x, mp.y, mp.z, t, col);
    }
    drawBoss(t);
    if (G.mode === "play" && G.obj && G.obj.x != null && Math.hypot(G.obj.x - p.x, G.obj.z - p.z) > 4 && Math.random() < dt * 14) {
      const gy3 = Math.max(surfY(G.obj.x, G.obj.z), WORLD.SEA + 1); puff(G.obj.x + (Math.random() - 0.5) * 0.8, gy3 + Math.random() * 0.5, G.obj.z + (Math.random() - 0.5) * 0.8, 1, { c: [1, 0.82, 0.35], size: 0.2, sp: 0.2, up: 4.5, drag: 0.2, life: 1.6 });
    }
  }
  stepParts(dt);
  sh.sort((a, b) => a[0] - b[0]); const n = Math.min(12, sh.length);
  for (let i = 0; i < n; i++) { SHADOWS[i * 4] = sh[i][1]; SHADOWS[i * 4 + 1] = sh[i][2]; SHADOWS[i * 4 + 2] = sh[i][3]; SHADOWS[i * 4 + 3] = sh[i][4]; }
  const prog = S.finale ? 1 : 0.55 + 0.45 * pagesCount() / 6, storm = G.boss && G.boss.active ? 0.6 : 0;
  const k = clamp(prog - storm, 0, 1);
  const lamp = G.mode === "play" && p.lampPos ? p.lampPos : [p ? p.x : 0, p ? p.y + 1.2 : 0, p ? p.z : 0];
  renderFrame({
    time: t, lamp, lampR: G.mode === "play" ? G.lampR : 0.1, lampI: S.oil > 0 ? 1.15 : 0.5,
    fogC: lerp3(SKY_A.hor, SKY_B.hor, k), skyTop: lerp3(SKY_A.top, SKY_B.top, k), sunC: lerp3(SKY_A.sun, SKY_B.sun, k),
    fog0: G.fog[0], fog1: G.fog[1], kabC: [0.4, 0.33, 0.64], kabR: G.mode === "play" ? G.lampR * 0.95 : 0.1, sunD: SUN_D, cloud: 0.45 + 0.45 * k,
    shadows: SHADOWS, shadowN: G.mode === "play" || G.mode === "title" ? n : 0
  });
}
function frame(ts) {
  requestAnimationFrame(frame);
  const now = ts / 1000; const real = Math.min(0.1, Math.max(0.0001, now - (G.last || now))); G.last = now;
  if (G.mode === "loading") return;
  const steps = Math.min(3, Math.ceil(real / 0.034)), dt = real / steps;
  G.time += real;
  if (G.mode === "play") {
    readInput(real);
    const freeze = modalOpen();
    if (!freeze) {
      for (let s = 0; s < steps; s++) {
        updatePlayer(dt); updateNpcs(dt); updateWarga(dt); updateItems(dt); updateOil(dt);
        if (!dialogOpen()) { updateShades(dt); updateBoss(dt); }
      }
      G.focus = uiBlocking() ? null : findFocus();
      if (INP.actQ) { INP.actQ = false; if (G.focus && !uiBlocking()) act(G.focus); }
      if (INP.burstQ) { INP.burstQ = false; if (!uiBlocking()) burst(); }
    } else { INP.actQ = false; INP.burstQ = false; }
    camUpdate(real, G.player);
    dialogTick(real);
    if ((G.objT -= real) <= 0) { G.objT = 0.3; G.obj = computeObjective(); }
    hudObjective(); hudPrompt(); labelsUpdate();
    if ((G.miniT -= real) <= 0) { G.miniT = 1 / 20; drawMini(); }
    if ((G.saveT += real) > 8) { G.saveT = 0; save(); }
  } else if (G.mode === "title") {
    const a = G.time * 0.06, cx = 104, cz = 96;
    setView(cx + Math.sin(a) * 36, 28 + Math.sin(G.time * 0.2) * 2, cz + Math.cos(a) * 36, cx, 15, cz - 6);
    labelsUpdate();
  }
  drawScene(real);
  musicTick();
}

/* ---------- mulai ---------- */
function startPlay() {
  S.started = true; G.mode = "play";
  $("#hud").hidden = false; $("#touch").hidden = false; document.body.classList.toggle("touchmode", isTouch());
  const p = G.player; CAM.yaw = p.yaw + Math.PI; CAM.tx = p.x; CAM.tz = p.z; CAM.ty = p.ry + 1.45; CAM.cur = CAM.dist;
  hud(); G.objT = 0; save();
  if (!S.talked.includes("guru")) setTimeout(() => toast(isTouch() ? "Geser di kiri layar untuk berjalan. Temui Guru Mizan, lalu ketuk Bicara." : "WASD untuk berjalan, seret mouse untuk kamera. Temui Guru Mizan, lalu tekan E."), 600);
}
async function buildAll(progress) {
  genWorld(); applySavedWorld();
  const total = WORLD.CW * WORLD.CD; let k = 0;
  const gl = GL.gl; for (const ch of GL.chunks) if (ch) { gl.deleteBuffer(ch.vbo); gl.deleteBuffer(ch.wvbo); gl.deleteVertexArray(ch.vao); gl.deleteVertexArray(ch.wvao); }
  GL.chunks.length = 0;
  for (let cz = 0; cz < WORLD.CD; cz++) for (let cx = 0; cx < WORLD.CW; cx++) {
    uploadChunk(cx, cz); k++;
    if (k % 15 === 0) { if (progress) progress(k / total); await new Promise((r) => setTimeout(r, 0)); }
  }
  if (!GL.ocean) buildOcean();
  GL.dirtyKab = true; buildMapImage(); spawnEntities();
}
async function resetGame() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* abaikan */ }
  const keep = Object.assign({}, S.set), av = S.avatar, cls = { mode: S.cls.mode, timer: S.cls.timer, turn: 0, teams: S.cls.teams.map((t, i) => Object.assign(mkTeam(i), { name: t.name })) };
  S = freshState(); S.set = keep; S.avatar = av; S.cls = cls; G.set = S.set;
  closeModal(true); G.mode = "loading"; $("#loading").hidden = false; $("#hud").hidden = true;
  await buildAll((f) => { $("#loadBar").style.width = Math.round(f * 100) + "%"; });
  $("#loading").hidden = true; G.mode = "title"; hud(); titleScreen();
}
async function boot(hot) {
  load();
  if (hot && hot.S && hot.S.v === 1) { S = Object.assign(freshState(), hot.S); S.set = Object.assign({}, DEFSET, S.set || {}); G.set = S.set; }
  G.canvas = $("#gl");
  applySettings();
  const gl = glInit(G.canvas, G.set.q === "high");
  if (!gl) { $("#loadTxt").textContent = "Perangkat atau peramban ini belum mendukung WebGL2. Coba buka dengan Chrome, Edge, Firefox, atau Safari versi terbaru."; $("#loadBar").parentElement.hidden = true; return; }
  G.canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); toast("Grafis terputus. Muat ulang halaman untuk melanjutkan.", "warn"); });
  inputInit(G.canvas); hudBuild();
  $("#tMap").addEventListener("click", () => openMap()); $("#tJournal").addEventListener("click", () => openJournal()); $("#tMenu").addEventListener("click", () => { if (G.mode === "play" && !modalOpen() && !dialogOpen()) openPause(); });
  await new Promise((r) => setTimeout(r, 30));
  await buildAll((f) => { $("#loadBar").style.width = Math.round(f * 100) + "%"; });
  $("#loading").hidden = true; hud();
  if (hot && hot.mode === "play" && S.started) { G.mode = "title"; startPlay(); } else { G.mode = "title"; titleScreen(); }
  requestAnimationFrame(frame);
}
const HOT = window.claude && window.claude.hot;
try { if (HOT && HOT.snapshot) HOT.snapshot(() => { save(); return { S: JSON.parse(JSON.stringify(S)), mode: G.mode === "play" ? "play" : "title" }; }); } catch (e) { /* tanpa pembaruan langsung */ }
const bootStart = (data) => boot(data || {}).catch((e) => { const t = $("#loadTxt"); if (t) t.textContent = "Gagal memuat: " + e.message; console.error(e); });
if (HOT && HOT.ready) HOT.ready(bootStart); else bootStart((HOT && HOT.data) || {});

</script>
