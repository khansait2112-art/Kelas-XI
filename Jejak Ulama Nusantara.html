<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jejak Ulama Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Tata letak: satu kolom untuk ponsel. Laut nila malam; adegan pelayaran di atas,
     lembar "kitab kuning" di bawahnya memuat peristiwa dan keputusan nakhoda. */
  --laut:#0f2340;
  --laut-2:#1b3a60;
  --kitab:#f4e5a9;
  --kitab-2:#e7d184;
  --tinta:#1e1a10;
  --soga:#8b3a1c;
  --emas:#e0ac48;
  --kabut:#bccadc;
  --benar:#2c6a3d;
  --salah:#9b2b2b;
  --display:"Aref Ruqaa","Times New Roman",serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 60% at 50% -10%,var(--laut-2) 0%,transparent 70%),var(--laut);color:var(--kabut);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{min-height:100%;max-width:560px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;color:var(--kitab);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2.4rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
a{color:var(--emas)}
.kecil{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--emas);font-weight:700}
.redup{font-size:.92rem}
.kitab{background:linear-gradient(180deg,var(--kitab),var(--kitab-2));color:var(--tinta);border-radius:6px;padding:18px 16px;
  box-shadow:0 0 0 1px rgba(30,26,16,.35) inset,0 0 0 5px var(--kitab) inset,0 0 0 6px rgba(139,58,28,.55) inset,0 14px 30px rgba(0,0,0,.35);
  display:flex;flex-direction:column;gap:12px;animation:masuk .25s ease-out}
.kitab h2,.kitab h3,.kitab .kecil{color:var(--soga)}
button{font:inherit;cursor:pointer;border:0;border-radius:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
.utama{background:var(--emas);color:var(--tinta);font-weight:700;padding:14px 18px;font-size:1.05rem;width:100%}
.utama:disabled{opacity:.5;cursor:not-allowed}
.sekunder{background:transparent;color:var(--kitab);font-weight:600;padding:12px 16px;width:100%;box-shadow:0 0 0 1.5px var(--kabut) inset}
.kitab .sekunder{color:var(--soga);box-shadow:0 0 0 1.5px var(--soga) inset}
.baris{display:flex;gap:10px;flex-wrap:wrap}
.baris>*{flex:1 1 130px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;color:var(--tinta)}
input,textarea{font:inherit;padding:12px;border-radius:8px;border:1.5px solid rgba(30,26,16,.55);background:#fff8d8;color:var(--tinta);width:100%}
textarea{min-height:110px;font-size:.9rem}
.daftar{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.galat{color:var(--salah);font-weight:600;font-size:.9rem;min-height:1.2em}

/* papan status */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px}
.hud .tengah{text-align:center}.hud .kanan{text-align:right}
.angka{font-family:var(--display);font-size:1.7rem;color:var(--kitab);line-height:1;font-variant-numeric:tabular-nums}
.lambung{display:flex;gap:5px;margin-top:4px}
.lambung i{width:22px;height:10px;border-radius:0 0 8px 8px;background:var(--emas)}
.lambung i.rusak{background:rgba(188,202,220,.22)}

/* adegan laga */
.laga{position:relative;height:132px;border-radius:8px;overflow:hidden;background:linear-gradient(180deg,#16335a 0%,#1f4a78 58%,#123a5e 58%,#0c2a47 100%);box-shadow:0 0 0 1px rgba(188,202,220,.25) inset}
.laga .ombak{position:absolute;left:-40px;right:-40px;top:54%;height:14px;background:radial-gradient(circle at 10px -4px,transparent 9px,#2a6093 10px) repeat-x;background-size:20px 14px;animation:ombak 2.2s linear infinite;opacity:.9}
.laga .kapal{position:absolute;left:8%;bottom:30px;width:78px;animation:ayun 2.6s ease-in-out infinite}
.laga .rintang{position:absolute;right:5%;top:10px;width:46%;text-align:center}
.laga .awan{display:block;height:56px;margin:0 auto 4px;width:88%;border-radius:40px 46px 30px 34px;background:radial-gradient(circle at 30% 40%,#56617a,#232b40 70%);box-shadow:-18px 12px 0 -6px #2c3550,20px 10px 0 -8px #39435f}
.laga .rintang b{display:block;color:var(--kitab);font-size:.8rem;font-weight:700;line-height:1.2}
.pip{display:flex;gap:4px;justify-content:center;margin-top:4px}
.pip i{width:16px;height:6px;border-radius:3px;background:#d86a5c}
.pip i.habis{background:rgba(188,202,220,.25)}
.laga .sinar{position:absolute;left:26%;right:30%;top:46px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--emas),#fff3c4);transform:scaleX(0);transform-origin:left;opacity:0}
.laga .sinar.aktif{animation:sinar .6s ease-out}
.laga .rintang.kena{animation:guncang .5s}
.laga .kapal.kena{animation:guncang .5s}
.laga.tenang .awan{opacity:.25}

.waktu-baris{display:flex;align-items:center;gap:10px}
.waktu{flex:1;height:8px;background:rgba(188,202,220,.2);border-radius:4px;overflow:hidden}
.waktu b{display:block;height:100%;width:100%;background:var(--emas);transform-origin:left}
.waktu b.genting{background:#e2685a}
.detik{font-variant-numeric:tabular-nums;font-weight:700;color:var(--kitab);min-width:3.2em;text-align:right}

.cap{align-self:flex-start;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:20px;background:var(--soga);color:var(--kitab)}
.cap.ingat{background:#3d5a80}
.kasus{background:rgba(139,58,28,.1);border-left:4px solid var(--soga);padding:10px 12px;border-radius:0 6px 6px 0;font-size:.96rem}
.soal{font-size:1.05rem;font-weight:700;line-height:1.45}
.pilihan{display:flex;flex-direction:column;gap:9px}
.pilihan button{text-align:left;padding:12px 13px;background:#fff8d8;color:var(--tinta);box-shadow:0 0 0 1.5px rgba(30,26,16,.5) inset;font-weight:500;display:flex;gap:10px;align-items:flex-start;font-size:.96rem;line-height:1.4}
.pilihan .h{font-family:var(--display);font-weight:700;color:var(--soga);min-width:1.2em}
.pilihan button:disabled{cursor:default;opacity:.6}
.pilihan button.benar{background:var(--benar);color:#fff;opacity:1;box-shadow:none}
.pilihan button.salah{background:var(--salah);color:#fff;opacity:1;box-shadow:none}
.pilihan button.benar .h,.pilihan button.salah .h{color:#fff}
.pilihan button.hilang{display:none}
.bekal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bekal button{background:transparent;color:var(--soga);font-weight:700;padding:8px 6px;box-shadow:0 0 0 1.5px var(--soga) inset;font-size:.8rem;line-height:1.25}
.bekal button span{display:block;font-weight:500;font-size:.72rem}
.bekal button:disabled{opacity:.38;cursor:not-allowed}
.bekal button.pasang{background:var(--soga);color:var(--kitab)}
.ulasan{border-top:1.5px dashed rgba(139,58,28,.6);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.vonis{font-weight:700}.vonis.ok{color:var(--benar)}.vonis.no{color:var(--salah)}

/* peta */
.peta{width:100%;height:auto;display:block}
.peta text{font-family:var(--body);font-size:12px;fill:var(--kabut);font-weight:600}
.peta .kini text{fill:var(--kitab)}
.peta .bintang{font-size:11px;fill:var(--emas)}
#kapalPeta{transition:transform 1.1s ease-in-out}

/* hasil & guru */
.nilai-besar{font-family:var(--display);font-size:4.6rem;line-height:.95;color:var(--soga);font-variant-numeric:tabular-nums}
.ringkas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ringkas div{background:rgba(139,58,28,.1);border-radius:6px;padding:10px 6px;text-align:center}
.ringkas b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.ringkas span{font-size:.75rem}
.kode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:#fff8d8;border:1.5px dashed var(--soga);border-radius:6px;padding:10px;user-select:all}
.gulung{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:left;border-bottom:1px solid rgba(30,26,16,.25);white-space:nowrap}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soga)}
td.n,th.n{text-align:right}
td.kurang{color:var(--salah);font-weight:700}td.tuntas{color:var(--benar);font-weight:700}
td button{background:transparent;color:var(--salah);font-weight:700;padding:2px 8px;box-shadow:0 0 0 1px var(--salah) inset;font-size:.8rem}
.butir{display:flex;flex-direction:column;gap:12px}
.butir .b{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.butir .atas{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.butir .batang{height:8px;border-radius:4px;background:rgba(30,26,16,.15);overflow:hidden}
.butir .batang i{display:block;height:100%;background:var(--benar)}
.butir .batang i.sulit{background:var(--salah)}
.butir .kunci{color:var(--benar);font-weight:600}

@keyframes masuk{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ombak{to{transform:translateX(20px)}}
@keyframes ayun{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(3px)}}
@keyframes guncang{0%,100%{translate:0 0}20%{translate:-7px 2px}40%{translate:6px -2px}60%{translate:-5px 1px}80%{translate:4px 0}}
@keyframes sinar{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.kitab,.laga .ombak,.laga .kapal,.laga .sinar.aktif,.laga .kena{animation:none!important}#kapalPeta{transition:none}}
</style>
</head>
<body>
<main id="app"></main>

<script>
/* ================= DATA PERMAINAN =================
   Bab 5: Meneladani Jejak Langkah Ulama Indonesia yang Mendunia.
   j: "I" = ingatan (30 detik), "A" = analisis/studi kasus (60 detik).
   Pilihan pertama selalu jawaban benar; urutan diacak saat tampil. */
var SOAL = [
/*0*/{j:"I",q:"Syekh Hamzah Fansuri menyampaikan ajaran tasawuf terutama melalui …",
 o:["syair-syair berbahasa Melayu","tafsir berbahasa Jawa beraksara pegon","kitab fikih berbahasa Arab","pengajian tetap di Masjidil Haram","hikayat tentang raja-raja Aceh"],
 p:"Hamzah Fansuri adalah penyair sufi dari Barus. Ia merintis syair Melayu, antara lain Syair Perahu."},
/*1*/{j:"A",k:"Raka rajin membuat konten dakwah berupa lagu dan puisi di media sosial. Seorang teman berkata, “Dakwah lewat lagu dan puisi itu kurang serius. Berhenti saja.”",
 q:"Jika dianalisis dari cara berdakwah Syekh Hamzah Fansuri, tanggapan yang paling tepat adalah …",
 o:["Raka dapat melanjutkan, sebab seni hanyalah sarana; yang wajib dijaga adalah kebenaran isi dan adabnya",
    "Raka sebaiknya berhenti, sebab dakwah yang sah hanya melalui ceramah dan kitab",
    "Raka boleh melanjutkan selama penontonnya banyak, sebab ukuran dakwah adalah popularitas",
    "Raka bebas memakai bentuk dan isi apa pun, sebab karya seni tidak terikat aturan",
    "Raka cukup menyalin syair Hamzah Fansuri agar pasti benar, tanpa perlu berkarya sendiri"],
 p:"Hamzah Fansuri memakai syair sebagai sarana dakwah. Yang diteladani adalah kreativitas memilih sarana tanpa mengorbankan isi dan adab."},
/*2*/{j:"I",q:"Tarjuman al-Mustafid karya Syekh Abdurrauf as-Singkili penting dalam sejarah karena merupakan …",
 o:["tafsir Al-Qur’an lengkap pertama berbahasa Melayu","tafsir Al-Qur’an pertama berbahasa Jawa beraksara pegon","kitab sejarah raja-raja dan tata pemerintahan Aceh","kitab fikih ibadah yang ditulis untuk Sultan Aceh","kumpulan syair tasawuf pertama di Nusantara"],
 p:"Tarjuman al-Mustafid adalah tafsir lengkap pertama dalam bahasa Melayu. Tafsir berbahasa Jawa pegon adalah karya Kiai Sholeh Darat."},
/*3*/{j:"A",k:"Saat diskusi kelas, seorang siswa memprotes: “Nuruddin ar-Raniri lahir di Gujarat, India. Ia tidak pantas dimasukkan sebagai ulama Nusantara.”",
 q:"Analisis yang paling tepat atas protes tersebut adalah …",
 o:["Kurang tepat, sebab kiprahnya sebagai mufti Aceh dan karya-karyanya yang berbahasa Melayu menjadi bagian sejarah Islam Nusantara",
    "Tepat, sebab seorang ulama dinilai dari tempat lahirnya, bukan dari tempat ia berkarya",
    "Kurang tepat, sebab ia wafat dan dimakamkan di Aceh sehingga otomatis menjadi ulama Nusantara",
    "Kurang tepat, sebab setiap ulama yang pernah singgah di Nusantara disebut ulama Nusantara",
    "Tepat, sebab ia menulis seluruh karyanya dalam bahasa Arab untuk pembaca di India"],
 p:"Ar-Raniri lahir di Ranir, Gujarat, tetapi mengabdi sebagai mufti Aceh pada masa Sultan Iskandar Tsani dan menulis karya berbahasa Melayu seperti Bustanus Salatin. Kontribusinya yang menentukan."},
/*4*/{j:"A",k:"Di grup kelas terjadi perdebatan panas tentang perbedaan tata cara ibadah. Dua kubu mulai saling menyebut sesat. Fajar, ketua kelas, ingin meneladani Syekh Abdurrauf as-Singkili yang dikenal menengahi perselisihan paham di Aceh dengan cara yang sejuk.",
 q:"Langkah Fajar yang paling sesuai dengan teladan tersebut adalah …",
 o:["mengajak kedua pihak menahan diri, menjelaskan bahwa perbedaan itu punya dasar dari para ulama, lalu membawa pertanyaannya kepada guru PAI",
    "membiarkan perdebatan berjalan, sebab perbedaan pendapat adalah urusan pribadi masing-masing",
    "memutuskan sendiri pendapat mana yang benar agar perdebatan cepat selesai",
    "mengeluarkan kubu yang anggotanya lebih sedikit supaya grup kembali tenang",
    "melarang semua pembahasan agama di grup kelas untuk seterusnya"],
 p:"Menengahi berarti meredakan, memberi pemahaman, dan merujuk kepada ahlinya. Membiarkan, memutuskan sepihak, atau membungkam bukan penyelesaian."},
/*5*/{j:"I",q:"Pasangan ulama dan karyanya yang tepat adalah …",
 o:["Syekh Abdus Samad al-Palimbani – Hidayatus Salikin","Syekh Nuruddin ar-Raniri – Tarjuman al-Mustafid","Syekh Nawawi al-Bantani – Faidhur Rahman","Kiai Sholeh Darat – Bustanus Salatin","Syekh Hamzah Fansuri – Sairus Salikin"],
 p:"Hidayatus Salikin dan Sairus Salikin adalah karya al-Palimbani. Tarjuman al-Mustafid karya as-Singkili, Faidhur Rahman karya Kiai Sholeh Darat, Bustanus Salatin karya ar-Raniri."},
/*6*/{j:"A",k:"Kak Salma kuliah di luar negeri dengan beasiswa. Ia berkata, “Karena aku jauh, aku tidak bisa berbuat apa-apa untuk kampung halamanku.” Padahal Syekh Abdus Samad al-Palimbani menetap di Haramain, tetapi menulis kitab berbahasa Melayu untuk umat di tanah airnya.",
 q:"Penilaian yang paling tepat terhadap pernyataan Kak Salma adalah …",
 o:["Kurang tepat, sebab jarak bukan penghalang; ia tetap dapat berkontribusi lewat karya, ilmu, dan jejaring yang dimilikinya",
    "Tepat, sebab kontribusi bagi tanah air hanya mungkin dilakukan oleh orang yang tinggal di dalamnya",
    "Kurang tepat, sebab ia seharusnya segera pulang dan meninggalkan kuliahnya demi kampung halaman",
    "Tepat, sebab tugas pelajar hanyalah belajar; berkontribusi adalah urusan setelah lulus",
    "Kurang tepat, sebab ia cukup sering mengunggah kerinduannya kepada kampung halaman"],
 p:"Al-Palimbani membuktikan bahwa orang yang jauh dari tanah air tetap dapat memberi manfaat nyata lewat karya dan ilmu."},
/*7*/{j:"A",k:"Dalam Hidayatus Salikin, al-Palimbani menyadur karya Imam al-Gazali ke bahasa Melayu, menyebutkan sumbernya, dan menambahkan penjelasan yang dibutuhkan masyarakatnya. Dinda menerjemahkan sebuah artikel asing untuk makalahnya, lalu mengumpulkannya sebagai tulisan sendiri.",
 q:"Perbedaan mendasar antara keduanya adalah …",
 o:["Al-Palimbani jujur menyebut sumber dan memberi nilai tambah, sedangkan Dinda menyembunyikan sumber sehingga tergolong plagiat",
    "Tidak ada perbedaan, sebab keduanya sama-sama memindahkan tulisan ke bahasa lain",
    "Perbedaannya hanya pada bahasa tujuan yang dipakai masing-masing",
    "Dinda lebih baik, sebab sumber yang ia terjemahkan lebih baru",
    "Keduanya keliru, sebab karya ulama besar tidak boleh disadur ke bahasa lain"],
 p:"Kejujuran ilmiah adalah adab berilmu. Menyadur dengan menyebut sumber dan menambah penjelasan berbeda dengan mengakui karya orang lain."},
/*8*/{j:"I",q:"Syekh Nawawi al-Bantani digelari Sayyid Ulama al-Hijaz karena …",
 o:["keluasan ilmu dan banyaknya karya beliau diakui para ulama di Tanah Hijaz","beliau keturunan langsung penguasa Hijaz","beliau memimpin perlawanan bersenjata di Hijaz","beliau menjabat mufti resmi Kesultanan Banten","beliau ulama Nusantara pertama yang menunaikan haji"],
 p:"Gelar itu berarti pemimpin ulama Hijaz, diberikan karena kedalaman ilmu dan karya beliau yang lebih dari seratus kitab."},
/*9*/{j:"A",k:"Syekh Nawawi tidak kembali menetap di Banten. Namun murid-muridnya dari Nusantara pulang, lalu mendirikan pesantren dan menggerakkan umat. Kitab-kitabnya pun dikaji di pesantren sampai sekarang.",
 q:"Dari fakta tersebut, pengaruh terbesar Syekh Nawawi bagi Indonesia paling tepat dijelaskan sebagai …",
 o:["pengaruh keilmuan yang menyebar lewat kitab dan murid-muridnya, meskipun beliau sendiri tinggal di Makkah",
    "pengaruh politik, karena beliau memimpin langsung perlawanan rakyat Banten dari Makkah",
    "pengaruh ekonomi, karena beliau membuka jalur dagang antara Banten dan Hijaz",
    "pengaruh yang terbatas, karena ilmunya hanya dinikmati penduduk Makkah",
    "pengaruh simbolis, yakni mengharumkan nama Banten tanpa dampak nyata di tanah air"],
 p:"Ilmu yang ditulis dan diajarkan terus hidup melampaui tempat dan zaman. Itulah pengaruh keilmuan Syekh Nawawi."},
/*10*/{j:"A",k:"Bima baru saja menjuarai olimpiade sains. Sejak itu ia sering meremehkan jawaban temannya dan enggan mengajari mereka. “Belajar saja sendiri,” katanya. Syekh Nawawi justru dikenal semakin rendah hati dan giat mengajar ketika ilmunya semakin luas.",
 q:"Masalah utama pada sikap Bima adalah …",
 o:["ia memisahkan ilmu dari adab, padahal ilmu semestinya membuatnya rendah hati dan mau berbagi",
    "ia belum cukup berprestasi sehingga memang belum pantas mengajari orang lain",
    "ia terlalu banyak belajar sehingga tidak punya waktu untuk bergaul",
    "tidak ada masalah, sebab orang berilmu wajar mendapat kedudukan lebih tinggi",
    "masalahnya ada pada teman-temannya yang iri terhadap prestasi Bima"],
 p:"Teladan Syekh Nawawi: ilmu yang bertambah harus diiringi tawaduk dan semangat mengajarkan."},
/*11*/{j:"I",q:"Tafsir Faidhur Rahman karya Kiai Sholeh Darat ditulis dengan …",
 o:["bahasa Jawa beraksara Arab (pegon)","bahasa Melayu beraksara Arab (Jawi)","bahasa Arab fusha","bahasa Jawa beraksara Latin","bahasa Jawa beraksara hanacaraka"],
 p:"Faidhur Rahman berbahasa Jawa dengan aksara pegon, yaitu huruf Arab yang dipakai untuk menulis bahasa Jawa."},
/*12*/{j:"A",k:"Pada masa penjajahan, usaha menerjemahkan Al-Qur’an dicurigai dan dihalangi. Kiai Sholeh Darat tetap menulis tafsir berbahasa Jawa, tetapi dengan aksara pegon yang akrab bagi santri dan tidak dipahami penjajah.",
 q:"Analisis yang paling tepat atas pilihan Kiai Sholeh Darat adalah …",
 o:["strategi cerdas untuk tetap mencerdaskan umat dengan bahasa mereka tanpa mengorbankan tujuan dakwah",
    "bentuk ketundukan kepada penjajah karena beliau tidak berani memakai huruf Latin",
    "kebetulan saja, sebab beliau tidak menguasai aksara selain pegon",
    "upaya merahasiakan ilmu agar hanya dikuasai kalangan santri",
    "penolakan terhadap bahasa Arab sebagai bahasa ilmu agama"],
 p:"Beliau menyiasati hambatan tanpa meninggalkan tujuan: masyarakat Jawa tetap dapat memahami Al-Qur’an."},

  tik=setInterval(function(){var sisa=Math.max(0,batas-(Date.now()-mulaiT)/1000);
    wb.style.transform="scaleX("+Math.min(1,sisa/WAKTU[d.j])+")";wb.className=sisa<=8?"genting":"";det.textContent=Math.ceil(sisa)+" dtk";
    if(sisa<=0)jawab(-1)},100);

  function jawab(n){
    if(dijawab)return;dijawab=true;clearInterval(tik);tik=null;
    var sisa=Math.max(0,batas-(Date.now()-mulaiT)/1000),ok=n>=0&&opsi[n].benar,dapat=0,pesan,karam=false;
    if(ok){S.streak++;if(S.streak>S.maxStreak)S.maxStreak=S.streak;S.benar++;S.pb++;S.mask|=(1<<id);
      dapat=Math.round(DASAR[d.j]*(1+0.5*Math.min(1,sisa/WAKTU[d.j]))*pengali(S.streak)/5)*5;S.poin+=dapat;
      pesan="Keputusan tepat. "+p.r+" melemah, +"+dapat+" poin.";
      L.sinar.classList.add("aktif");L.rint.classList.add("kena");var pp=L.pip.children[p.s.length-S.pb];if(pp)pp.className="habis";
    }else{S.streak=0;L.kapal.classList.add("kena");
      if(perisai){pesan=(n<0?"Waktu habis. ":"Keputusan keliru. ")+"Perisai menahan kerusakan."}
      else{S.hull--;pesan=(n<0?"Waktu habis. ":"Keputusan keliru. ")+"Lambung kapal rusak.";
        if(S.hull<=0){karam=true;S.karam++;S.poin=Math.max(0,S.poin-200);S.hull=3;pesan+=" Kapal karam! Poin dipotong 200 dan kapal diperbaiki darurat."}}}
    tombol.forEach(function(b,x){b.disabled=true;if(opsi[x].benar){b.classList.remove("hilang");b.classList.add("benar")}else if(x===n)b.classList.add("salah")});
    bL.disabled=bJ.disabled=bP.disabled=true;
    poinEl.textContent=ribuan(S.poin);lamb.textContent="";lamb.appendChild(lambungEl());kombo.textContent="×"+pengali(S.streak+1);
    var akhirPel=S.si===p.s.length-1;
    var lj=h("button",{cls:"utama",type:"button",txt:akhirPel?"Tinggalkan pelabuhan":"Tantangan berikutnya",onclick:function(){if(akhirPel)ringkas();else{S.si++;tantangan()}}});
    var u=h("div",{cls:"ulasan"},[h("p",{cls:"vonis "+(ok?"ok":"no"),txt:pesan}),h("p",{txt:d.p}),lj]);
    k.appendChild(u);lj.focus({preventScroll:true});u.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}
function pengali(st){return st>=4?2:st===3?1.5:st===2?1.2:1}

function ringkas(){
  bersih();S.layar="ringkas";
  var p=PEL[S.selesai],n=p.s.length,salah=n-S.pb,b=salah===0?3:salah===1?2:1,hadiah=null;
  S.bintang[S.selesai]=b;
  if(salah===0){var jenis=["l","j","p"][Math.floor(Math.random()*3)];S.bekal[jenis]++;hadiah={l:"Lentera",j:"Jam pasir",p:"Perisai"}[jenis]}
  S.selesai++;
  var akhir=S.selesai===PEL.length;
  app.appendChild(h("header",null,[h("p",{cls:"kecil",txt:"Pelabuhan "+p.n}),h("h1",{txt:salah===0?p.r+" takluk":"Lolos dari "+p.r})]));
  app.appendChild(laga(p,salah,true).el);
  app.appendChild(h("section",{cls:"kitab"},[
    h("div",{cls:"nilai-besar",txt:"★★★".slice(0,b)+"☆☆☆".slice(0,3-b),style:"font-size:3rem"}),
    h("p",{txt:S.pb+" dari "+n+" keputusan tepat di pelabuhan ini."}),
    hadiah?h("p",null,[h("strong",{txt:"Hadiah pelabuhan: "+hadiah+". "}),"Penduduk "+p.n+" menambah bekalmu."]):h("p",{txt:"Lewati pelabuhan tanpa salah untuk mendapat bekal baru."}),
    h("button",{cls:"utama",type:"button",txt:akhir?"Lihat hasil pelayaran":"Kembali ke peta",onclick:function(){if(akhir)selesai();else peta()}})]));
}

/* ================= SISWA: HASIL ================= */
function selesai(){
  S.nilai=Math.round(S.benar/SOAL.length*100);S.durasi=Math.round((Date.now()-S.awal)/1000);
  var coba=muat(K_COBA,{}),kunci=(S.nama+"|"+S.kelas).toLowerCase();coba[kunci]=(coba[kunci]||0)+1;S.ke=coba[kunci];simpan(K_COBA,coba);
  S.kode=buatKode([S.nama,S.kelas,S.absen,S.mask,S.poin,S.durasi,S.karam,Math.floor(Date.now()/60000),S.ke]);
  var g=muat(K_GURU,[]);if(g.indexOf(S.kode)<0){g.push(S.kode);simpan(K_GURU,g)}
  hasil();
}
function teksLaporan(){var m=Math.floor(S.durasi/60),d=S.durasi%60;
  return "LAPORAN JEJAK ULAMA NUSANTARA\nUlangan Harian PAI & BP Kelas XI Bab 5\nNama: "+S.nama+"\nKelas: "+S.kelas+(S.absen?" / Absen "+S.absen:"")+
  "\nNilai: "+S.nilai+" (tepat "+S.benar+" dari "+SOAL.length+")\nPoin: "+ribuan(S.poin)+"\nWaktu: "+m+" menit "+d+" detik\nPercobaan ke-"+S.ke+"\nKode laporan:\n"+S.kode}
function hasil(){
  bersih();S.layar="hasil";
  var bt=S.bintang.reduce(function(a,b){return a+b},0);
  app.appendChild(h("header",null,[h("p",{cls:"kecil",txt:"Pelayaran selesai"}),h("h1",{txt:gelar(S.nilai)})]));
  var sal=h("button",{cls:"utama",type:"button",txt:"Salin laporan untuk guru",onclick:function(){salin(teksLaporan(),sal,"Laporan tersalin, kirimkan ke guru")}});
  app.appendChild(h("section",{cls:"kitab"},[
    h("p",{style:"font-weight:700",txt:S.nama+" · "+S.kelas+(S.absen?" · absen "+S.absen:"")}),
    h("p",{cls:"kecil",txt:"Nilai ulangan"}),h("div",{cls:"nilai-besar",txt:String(S.nilai)}),
    h("div",{cls:"ringkas"},[
      h("div",null,[h("b",{txt:S.benar+"/"+SOAL.length}),h("span",{txt:"keputusan tepat"})]),
      h("div",null,[h("b",{txt:ribuan(S.poin)}),h("span",{txt:"poin"})]),
      h("div",null,[h("b",{txt:bt+"/"+PEL.length*3}),h("span",{txt:"bintang"})])]),
    h("p",{txt:"Kapal karam "+S.karam+" kali. Rangkaian keputusan tepat terpanjang: "+S.maxStreak+". Percobaan ke-"+S.ke+"."}),
    h("h3",{txt:"Kode laporan"}),
    h("p",{txt:"Nilaimu baru tercatat setelah kode ini sampai ke guru. Salin lalu kirimkan sesuai arahan guru."}),
    h("div",{cls:"kode",txt:S.kode}),sal]));
  var salah=[];for(var i=0;i<SOAL.length;i++)if(!(S.mask&(1<<i)))salah.push(i);
  if(salah.length){app.appendChild(h("section",{cls:"kitab"},[h("h2",{txt:"Pelajari lagi"}),
    h("ol",{cls:"daftar"},salah.map(function(i){return h("li",null,[h("div",{txt:SOAL[i].q}),h("div",{style:"font-weight:700;color:var(--benar)",txt:"Jawaban: "+SOAL[i].o[0]})])}))]))}
  app.appendChild(h("button",{cls:"sekunder",type:"button",txt:"Nakhoda berikutnya",onclick:function(){S={layar:"beranda"};beranda()}}));
}

/* ================= GURU ================= */
function guruGerbang(galat){
  bersih();
  app.appendChild(h("header",null,[h("p",{cls:"kecil",txt:"Jejak Ulama Nusantara"}),h("h1",{txt:"Ruang Guru"})]));
  var pin=h("input",{id:"pin",type:"password",inputMode:"numeric",maxLength:8,autocomplete:"off"});
  app.appendChild(h("form",{cls:"kitab",noValidate:true,onsubmit:function(ev){ev.preventDefault();if(pin.value.trim()===PIN_GURU){guruMasuk=true;guruPanel()}else guruGerbang("PIN keliru. Coba lagi.")}},[
    h("label",null,["PIN guru",pin]),h("p",{cls:"galat",role:"alert",txt:galat||""}),
    h("button",{cls:"utama",type:"submit",txt:"Masuk"})]));
  app.appendChild(h("p",{cls:"redup"},[h("a",{href:"#siswa",txt:"Ke tampilan siswa"})]));
}
function guruPanel(pesan){
  bersih();
  var kodes=muat(K_GURU,[]),data=kodes.map(bacaKode).filter(Boolean);
  var kkm=muat("jejakUlama.kkm",75);
  data.sort(function(a,b){return a.kelas.localeCompare(b.kelas)||(parseInt(a.absen,10)||999)-(parseInt(b.absen,10)||999)||a.nama.localeCompare(b.nama)});
  app.appendChild(h("header",null,[h("p",{cls:"kecil",txt:"Ruang Guru · tersimpan di perangkat ini"}),h("h1",{txt:"Pantauan nilai"})]));

  var ta=h("textarea",{id:"tempel",placeholder:"Tempel kode laporan atau seluruh pesan siswa di sini. Boleh banyak sekaligus."});
  app.appendChild(h("section",{cls:"kitab"},[h("h2",{txt:"Masukkan laporan siswa"}),ta,
    h("p",{cls:"galat",role:"status",style:"color:var(--soga)",txt:pesan||""}),
    h("button",{cls:"utama",type:"button",txt:"Tambahkan ke pantauan",onclick:function(){
      var temu=ta.value.match(/JU5-[A-Za-z0-9_-]+\.[a-z0-9]+/g)||[],baru=0,rusak=0,k=muat(K_GURU,[]);
      temu.forEach(function(c){if(!bacaKode(c)){rusak++;return}if(k.indexOf(c)<0){k.push(c);baru++}});
      simpan(K_GURU,k);
      guruPanel(temu.length?baru+" laporan baru ditambahkan"+(rusak?", "+rusak+" kode tidak sah ditolak":"")+(temu.length-baru-rusak>0?", "+(temu.length-baru-rusak)+" sudah ada":"")+".":"Tidak ada kode laporan dalam teks itu.")}})]));

  if(!data.length){app.appendChild(h("section",{cls:"kitab"},[h("p",{txt:"Belum ada laporan. Minta siswa menekan “Salin laporan untuk guru” di akhir permainan, lalu tempel kiriman mereka di atas."})]))}
  else{
    var nilai=data.map(function(r){return r.nilai}),rata=Math.round(nilai.reduce(function(a,b){return a+b},0)/nilai.length*10)/10,tuntas=nilai.filter(function(v){return v>=kkm}).length;
    var iK=h("input",{id:"kkm",inputMode:"numeric",maxLength:3,value:String(kkm),style:"max-width:90px",onchange:function(){var v=parseInt(iK.value,10);if(v>=0&&v<=100){simpan("jejakUlama.kkm",v);guruPanel()}}});
    var tb=h("table");tb.appendChild(h("tr",null,[["Kelas",""],["Abs","n"],["Nama",""],["Nilai","n"],["Tepat","n"],["Poin","n"],["Karam","n"],["Menit","n"],["Ke","n"],["",""]].map(function(x){return h("th",{cls:x[1],txt:x[0]})})));
    data.forEach(function(r){tb.appendChild(h("tr",null,[
      h("td",{txt:r.kelas}),h("td",{cls:"n",txt:r.absen||"-"}),h("td",{txt:r.nama}),
      h("td",{cls:"n "+(r.nilai>=kkm?"tuntas":"kurang"),txt:String(r.nilai)}),h("td",{cls:"n",txt:r.benar+"/"+SOAL.length}),
      h("td",{cls:"n",txt:ribuan(r.poin)}),h("td",{cls:"n",txt:String(r.karam)}),h("td",{cls:"n",txt:String(Math.round(r.durasi/60))}),h("td",{cls:"n",txt:String(r.ke)}),
      h("td",null,[h("button",{type:"button","aria-label":"Hapus laporan "+r.nama,txt:"Hapus",onclick:function(){simpan(K_GURU,muat(K_GURU,[]).filter(function(c){return c!==r.kode}));guruPanel()}})])]))});
    var sal=h("button",{cls:"utama",type:"button",txt:"Salin rekap nilai",onclick:function(){
      salin("Kelas\tAbsen\tNama\tNilai\tTepat\tPoin\tKaram\tMenit\tPercobaan\n"+data.map(function(r){return [r.kelas,r.absen,r.nama,r.nilai,r.benar,r.poin,r.karam,Math.round(r.durasi/60),r.ke].join("\t")}).join("\n"),sal,"Rekap tersalin, tempel di Excel atau Sheets")}});
    var yakin=false,hp=h("button",{cls:"sekunder",type:"button",txt:"Hapus semua laporan",onclick:function(){if(!yakin){yakin=true;hp.textContent="Tekan sekali lagi untuk menghapus";return}simpan(K_GURU,[]);guruPanel()}});
    app.appendChild(h("section",{cls:"kitab"},[h("h2",{txt:"Rekap kelas"}),
      h("div",{cls:"ringkas"},[
        h("div",null,[h("b",{txt:String(data.length)}),h("span",{txt:"laporan"})]),
        h("div",null,[h("b",{txt:String(rata).replace(".",",")}),h("span",{txt:"rata-rata"})]),
        h("div",null,[h("b",{txt:tuntas+"/"+data.length}),h("span",{txt:"tuntas"})])]),
      h("p",{txt:"Tertinggi "+Math.max.apply(null,nilai)+", terendah "+Math.min.apply(null,nilai)+"."}),
      h("label",null,["Batas tuntas (KKM)",iK]),
      h("div",{cls:"gulung"},[tb]),sal,hp]));

    var butir=h("div",{cls:"butir"});
    SOAL.forEach(function(s,i){var c=data.filter(function(r){return r.mask&(1<<i)}).length,pr=Math.round(c/data.length*100),pel="";
      PEL.forEach(function(p){if(p.s.indexOf(i)>=0)pel=p.n});
      butir.appendChild(h("div",{cls:"b"},[
        h("div",{cls:"atas"},[h("span",{txt:(i+1)+". "+pel+" · "+(s.j==="I"?"ingatan":"analisis")}),h("span",{txt:pr+"% tepat"})]),
        h("div",{cls:"batang"},[h("i",{cls:pr<50?"sulit":"",style:"width:"+pr+"%"})]),
        h("div",{txt:s.q}),h("div",{cls:"kunci",txt:"Kunci: "+s.o[0]})]))});
    app.appendChild(h("section",{cls:"kitab"},[h("h2",{txt:"Analisis butir soal"}),h("p",{txt:"Batang merah menandai soal yang dijawab tepat oleh kurang dari separuh siswa."}),butir]));
  }
  app.appendChild(h("p",{cls:"redup"},[h("a",{href:"#siswa",txt:"Ke tampilan siswa"})]));
}

/* ================= RUTE & MULAI ================= */
function arah(){
  if(location.hash==="#guru"){if(guruMasuk)guruPanel();else guruGerbang();return}
  if(S.layar==="main"&&S.awal)tantangan();
  else if(S.layar==="tiba"&&S.awal)tiba();
  else if(S.layar==="peta"&&S.awal)peta();
  else if(S.layar==="hasil"&&S.kode)hasil();
  else if(S.layar==="ringkas"&&S.awal){if(S.selesai>=PEL.length)selesai();else peta()}
  else beranda();
}
function boot(d){if(d&&d.layar)S=d;arah()}
window.addEventListener("hashchange",arah);
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(function(){return S})}catch(e){}}
if(hot&&hot.ready){hot.ready(boot)}else{boot((hot&&hot.data)||{})}
</script>
