<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pilot Jejak Ulama Nusantara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Dunia game kartun: langit siang, garis tebal, tombol 3D. Satu kolom untuk ponsel;
     arena (peta atau adegan bos) di atas, kartu aksi di bawah. */
  --langit:#3a86ff;
  --langit-2:#7fd8ff;
  --tinta:#1b1f3b;
  --kartu:#fffdf3;
  --kuning:#ffd23f;
  --merah:#ff5a5f;
  --benar:#17a05d;
  --salah:#e23b3b;
  --soga:#6a3df0;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--langit) 0%,#4cc0f5 55%,var(--langit-2) 100%) fixed;color:#fff;font-family:var(--body);font-weight:700;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;left:-200px;right:-200px;height:120px;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 60px 70px,rgba(255,255,255,.75) 34px,transparent 35px),radial-gradient(circle at 100px 56px,rgba(255,255,255,.75) 44px,transparent 45px),radial-gradient(circle at 146px 74px,rgba(255,255,255,.75) 32px,transparent 33px) repeat-x;background-size:420px 120px;animation:awanjalan 40s linear infinite}
body::before{top:6%}
body::after{top:58%;opacity:.55;animation-duration:65s;background-size:560px 120px}
#app{position:relative;z-index:1;min-height:100%;max-width:560px;margin:0 auto;padding:14px 14px 34px;display:flex;flex-direction:column;gap:12px}
#app.gempa{animation:gempa .4s}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
#kilat{position:fixed;inset:0;pointer-events:none;z-index:49;opacity:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.08;letter-spacing:.01em;color:#fff;
  text-shadow:-2px -2px 0 var(--tinta),2px -2px 0 var(--tinta),-2px 2px 0 var(--tinta),2px 2px 0 var(--tinta),0 5px 0 var(--tinta)}
h1{font-size:2.3rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
a{color:#fff}
.kecil{align-self:flex-start;display:inline-block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:#fff;background:rgba(27,31,59,.55);padding:3px 10px;border-radius:20px}
.redup{font-size:.92rem;text-shadow:0 1px 0 rgba(27,31,59,.5)}
header{display:flex;flex-direction:column;gap:6px}
.kitab{background:var(--kartu);color:var(--tinta);border:3px solid var(--tinta);border-radius:20px;padding:16px 14px;box-shadow:0 7px 0 var(--tinta);display:flex;flex-direction:column;gap:12px;animation:muncul .35s cubic-bezier(.3,1.5,.6,1)}
.kitab h2,.kitab h3{color:var(--soga);text-shadow:none}
.kitab .kecil{background:var(--soga)}
.kitab a{color:var(--soga)}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:4px solid #fff;outline-offset:2px}
.kitab button:focus-visible,.kitab input:focus-visible,.kitab textarea:focus-visible,.kitab summary:focus-visible{outline-color:var(--soga)}
.utama{font-family:var(--display);background:var(--kuning);color:var(--tinta);padding:13px 18px;font-size:1.3rem;width:100%;border:3px solid var(--tinta);border-radius:18px;box-shadow:0 6px 0 var(--tinta);letter-spacing:.03em;transition:transform .06s,box-shadow .06s}
.utama:active{transform:translateY(5px);box-shadow:0 1px 0 var(--tinta)}
.utama.denyut{animation:denyut 1.1s ease-in-out infinite}
.utama:disabled{opacity:.5;cursor:not-allowed;animation:none}
.sekunder{font-family:var(--display);background:#fff;color:var(--tinta);padding:10px 16px;width:100%;border:3px solid var(--tinta);border-radius:16px;box-shadow:0 4px 0 var(--tinta);font-size:1.05rem}
.sekunder:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.baris{display:flex;gap:10px;flex-wrap:wrap}
.baris>*{flex:1 1 120px}
label{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:.9rem}
input,textarea{font:inherit;padding:11px 12px;border-radius:14px;border:3px solid var(--tinta);background:#fff;color:var(--tinta);width:100%}
textarea{min-height:110px;font-size:.9rem}
.daftar{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:.93rem}
summary{font-family:var(--display);font-size:1.1rem;color:var(--soga);cursor:pointer}
.galat{color:var(--salah);font-weight:800;font-size:.9rem;min-height:1.2em}

/* layar judul */
.logo{align-items:center;text-align:center;padding-top:6px}
.logo h1{font-size:3.1rem}
.logo h1 span{display:inline-block;animation:lompat 1.6s ease-in-out infinite}
.logo h1.b{font-size:2.2rem;color:var(--kuning)}
.lintas{position:relative;height:64px;overflow:hidden}
.lintas div{position:absolute;top:6px;left:0;width:96px;animation:lintas 5s linear infinite}

/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pil{background:#fff;color:var(--tinta);border:3px solid var(--tinta);border-radius:30px;padding:3px 12px;box-shadow:0 4px 0 var(--tinta);font-family:var(--display);font-size:1.15rem;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pil small{font-family:var(--body);font-weight:800;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soga)}
.pil.kombo.api{background:var(--kuning);animation:denyut .5s ease-in-out infinite}
.lambung{display:flex;gap:2px;font-size:1.25rem;line-height:1;color:var(--merah)}
.lambung i{font-style:normal;display:inline-block}
.lambung i.rusak{color:#c9cbd6}
.lambung.baru i.rusak:first-of-type{animation:pecah .5s}

/* adegan bos */
.laga{position:relative;height:168px;border:3px solid var(--tinta);border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#5b3df5 0%,#b05cff 60%,#ff9bd2 100%);box-shadow:0 6px 0 var(--tinta)}
.laga::before{content:"";position:absolute;left:-300px;right:0;top:0;bottom:0;background:repeating-linear-gradient(100deg,transparent 0 46px,rgba(255,255,255,.14) 46px 50px);animation:garis .5s linear infinite}
.laga .pes{position:absolute;left:5%;top:52px;width:104px;animation:ayun 1.2s ease-in-out infinite;z-index:2}
.laga .pes.kena{animation:guncang .5s}
.bos{position:absolute;right:7%;top:16px;width:108px;height:84px;background:var(--bw,#8ecae6);border:3px solid var(--tinta);border-radius:52% 48% 46% 54%/62% 60% 40% 38%;box-shadow:inset -9px -9px 0 rgba(0,0,0,.16);animation:bosmasuk .6s cubic-bezier(.3,1.5,.6,1),ngambang 1.8s ease-in-out .6s infinite;z-index:2}
.bos .mata{position:absolute;top:26px;width:20px;height:22px;background:#fff;border:3px solid var(--tinta);border-radius:50%}
.bos .mata::after{content:"";position:absolute;left:3px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--tinta);animation:lirik 3s infinite}
.bos .mata::before{content:"";position:absolute;top:-10px;width:24px;height:5px;background:var(--tinta);border-radius:3px}
.bos .mata.l{left:22px}.bos .mata.l::before{left:-4px;transform:rotate(20deg)}
.bos .mata.r{right:22px}.bos .mata.r::before{right:-4px;transform:rotate(-20deg)}
.bos .mulut{position:absolute;left:50%;bottom:10px;width:30px;height:13px;margin-left:-15px;border:3px solid var(--tinta);border-bottom:0;border-radius:20px 20px 0 0;background:#fff}
.bos.kena{animation:boskena .5s}
.bos.kalah{animation:boskalah .9s forwards}
.bos.jinak .mata::before{display:none}
.bos.jinak .mulut{border:3px solid var(--tinta);border-top:0;border-radius:0 0 20px 20px;height:11px}
.hp{position:absolute;right:7%;top:108px;width:108px;height:14px;border:3px solid var(--tinta);border-radius:9px;background:#fff;overflow:hidden;z-index:2}
.hp i{display:block;height:100%;background:var(--merah);transition:width .45s cubic-bezier(.3,1.4,.6,1)}
.bosnama{position:absolute;right:0;width:calc(108px + 14%);top:128px;text-align:center;font-family:var(--display);font-size:.95rem;line-height:1.05;z-index:2;text-shadow:-1.5px -1.5px 0 var(--tinta),1.5px -1.5px 0 var(--tinta),-1.5px 1.5px 0 var(--tinta),1.5px 1.5px 0 var(--tinta)}
.peluru{position:absolute;left:30%;top:58px;font-size:1.9rem;color:var(--kuning);z-index:3;text-shadow:0 0 0 var(--tinta),2px 2px 0 var(--tinta)}
.petir{position:absolute;right:38%;top:50px;font-size:2rem;color:#fff35c;z-index:3;text-shadow:2px 2px 0 var(--tinta)}
.cap-besar{position:absolute;left:50%;top:50%;z-index:4;font-family:var(--display);font-size:2.3rem;white-space:nowrap;transform:translate(-50%,-50%) rotate(-8deg);animation:stempel .9s cubic-bezier(.3,1.6,.6,1) forwards;
  text-shadow:-2px -2px 0 var(--tinta),2px -2px 0 var(--tinta),-2px 2px 0 var(--tinta),2px 2px 0 var(--tinta),0 5px 0 var(--tinta)}
.cap-besar.ok{color:var(--kuning)}.cap-besar.no{color:#ffb3b3}

/* waktu */
.waktu-baris{display:flex;align-items:center;gap:8px}
.waktu{flex:1;height:18px;background:#fff;border:3px solid var(--tinta);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--tinta)}
.waktu b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#17c964,#b8f03a);transform-origin:left}
.waktu b.genting{background:var(--merah)}
.waktu-baris.genting{animation:denyut .5s ease-in-out infinite}
.detik{font-family:var(--display);font-size:1.3rem;min-width:2.2em;text-align:right;text-shadow:-1.5px -1.5px 0 var(--tinta),1.5px -1.5px 0 var(--tinta),-1.5px 1.5px 0 var(--tinta),1.5px 1.5px 0 var(--tinta);font-variant-numeric:tabular-nums}

/* soal */
.cap{align-self:flex-start;font-family:var(--display);font-size:.85rem;letter-spacing:.04em;padding:3px 12px;border-radius:20px;background:var(--soga);color:#fff;border:2px solid var(--tinta)}
.cap.ingat{background:#0aa6c2}
.kasus{background:#efe9ff;border:2px dashed var(--soga);padding:10px 12px;border-radius:14px;font-size:.95rem;font-weight:700}
.soal{font-size:1.06rem;font-weight:800;line-height:1.4}
.pilihan{display:flex;flex-direction:column;gap:10px}
.pilihan button{text-align:left;padding:10px 12px;background:#fff;color:var(--tinta);border:3px solid var(--tinta);border-radius:16px;box-shadow:0 4px 0 var(--tinta);font-weight:700;display:flex;gap:10px;align-items:center;font-size:.95rem;line-height:1.35;animation:geser .35s cubic-bezier(.3,1.4,.6,1) backwards}
.pilihan button:nth-child(2){animation-delay:.06s}.pilihan button:nth-child(3){animation-delay:.12s}.pilihan button:nth-child(4){animation-delay:.18s}.pilihan button:nth-child(5){animation-delay:.24s}
.pilihan button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.pilihan .h{flex:none;font-family:var(--display);width:30px;height:30px;border-radius:50%;border:2px solid var(--tinta);display:grid;place-items:center;color:#fff;background:var(--merah)}
.pilihan button:nth-child(2) .h{background:#3a86ff}.pilihan button:nth-child(3) .h{background:#17a05d}.pilihan button:nth-child(4) .h{background:#ff8c1a}.pilihan button:nth-child(5) .h{background:#a23bf0}
.pilihan button:disabled{cursor:default;opacity:.55}
.pilihan button.benar{background:var(--benar);color:#fff;opacity:1;animation:hore .5s}
.pilihan button.salah{background:var(--salah);color:#fff;opacity:1;animation:guncang .45s}
.pilihan button.hilang{display:none}
.bekal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bekal button{font-family:var(--display);background:#e7fbff;color:var(--tinta);padding:7px 4px;border:3px solid var(--tinta);border-radius:14px;box-shadow:0 4px 0 var(--tinta);font-size:.92rem;line-height:1.15}
.bekal button span{display:block;font-family:var(--body);font-weight:800;font-size:.7rem}
.bekal button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.bekal button:disabled{opacity:.4;cursor:not-allowed}
.bekal button.pasang{background:var(--kuning);opacity:1}
.ulasan{border-top:3px dashed var(--tinta);padding-top:12px;display:flex;flex-direction:column;gap:10px;animation:muncul .3s}
.vonis{font-family:var(--display);font-size:1.25rem}.vonis.ok{color:var(--benar)}.vonis.no{color:var(--salah)}

/* peta */
canvas.langit{width:100%;height:min(60vh,500px);min-height:320px;border:3px solid var(--tinta);border-radius:20px;box-shadow:0 6px 0 var(--tinta);touch-action:none;display:block;background:#1fa3d8;cursor:crosshair}
.chip{display:flex;gap:6px;flex-wrap:wrap}
.chip span{background:#fff;color:var(--tinta);border:2px solid var(--tinta);border-radius:20px;padding:1px 10px;font-size:.8rem;font-weight:800}
.chip span.sudah{background:var(--kuning)}
#suara{position:fixed;right:10px;bottom:10px;z-index:40;min-height:36px;padding:4px 12px;border-radius:20px;background:#fff;border:3px solid var(--tinta);box-shadow:0 4px 0 var(--tinta);font-family:var(--display);font-size:.7rem;color:var(--tinta)}
.melayang{position:fixed;z-index:60;pointer-events:none;font-family:var(--display);font-size:1.5rem;color:var(--kuning);transform:translate(-50%,-50%);animation:naik 1s ease-out forwards;white-space:nowrap;
  text-shadow:-2px -2px 0 var(--tinta),2px -2px 0 var(--tinta),-2px 2px 0 var(--tinta),2px 2px 0 var(--tinta)}
.melayang.besar{font-size:2.3rem;color:#fff}

/* hasil & guru */
.bintang3{display:flex;justify-content:center;gap:6px;font-size:3.4rem;line-height:1;color:#d9dbe6}
.bintang3 i{font-style:normal;animation:bintang .5s cubic-bezier(.3,1.8,.6,1) backwards}
.bintang3 i.on{color:var(--kuning);text-shadow:-2px -2px 0 var(--tinta),2px -2px 0 var(--tinta),-2px 2px 0 var(--tinta),2px 2px 0 var(--tinta)}
.bintang3 i:nth-child(2){animation-delay:.3s}.bintang3 i:nth-child(3){animation-delay:.6s}
.nilai-besar{font-family:var(--display);font-size:5rem;line-height:.95;color:var(--soga);font-variant-numeric:tabular-nums;text-align:center}
.ringkas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ringkas div{background:#efe9ff;border:2px solid var(--tinta);border-radius:14px;padding:8px 4px;text-align:center}
.ringkas b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;font-variant-numeric:tabular-nums}
.ringkas span{font-size:.72rem;font-weight:800}
.kode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;font-weight:500;word-break:break-all;background:#fff;border:3px dashed var(--soga);border-radius:14px;padding:10px;user-select:all}
.gulung{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:left;border-bottom:2px solid rgba(27,31,59,.15);white-space:nowrap}
th{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soga)}
td.n,th.n{text-align:right}
td.kurang{color:var(--salah);font-weight:800}td.tuntas{color:var(--benar);font-weight:800}
td button{background:#fff;color:var(--salah);font-weight:800;padding:2px 8px;border:2px solid var(--salah);border-radius:10px;font-size:.8rem}
.butir{display:flex;flex-direction:column;gap:12px}
.butir .b{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.butir .atas{display:flex;justify-content:space-between;gap:8px;font-weight:800}
.butir .batang{height:10px;border-radius:6px;background:#e4e1f3;overflow:hidden}
.butir .batang i{display:block;height:100%;background:var(--benar)}
.butir .batang i.sulit{background:var(--salah)}
.butir .kunci{color:var(--benar);font-weight:800}

@keyframes awanjalan{to{background-position:420px 0}}
@keyframes muncul{from{opacity:0;transform:scale(.85) translateY(14px)}to{opacity:1;transform:none}}
@keyframes denyut{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes lompat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes lintas{0%{transform:translateX(-120px) translateY(8px) rotate(-4deg)}50%{transform:translateX(calc(50vw - 48px)) translateY(-4px) rotate(3deg)}100%{transform:translateX(100vw) translateY(8px) rotate(-4deg)}}
@keyframes garis{to{transform:translateX(-50px)}}
@keyframes ayun{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(8px) rotate(3deg)}}
@keyframes ngambang{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes bosmasuk{from{transform:translateY(-140px) scale(.5)}to{transform:none}}
@keyframes lirik{0%,45%,100%{transform:translateX(0)}50%,95%{transform:translateX(4px)}}
@keyframes boskena{0%,100%{transform:none;filter:none}20%{transform:translateX(12px) rotate(8deg);filter:brightness(3)}40%{transform:translateX(-9px) rotate(-6deg)}60%{transform:translateX(6px);filter:brightness(2)}80%{transform:translateX(-3px)}}
@keyframes boskalah{0%{transform:none;opacity:1}100%{transform:translateY(40px) rotate(720deg) scale(0);opacity:0}}
@keyframes guncang{0%,100%{translate:0 0}20%{translate:-8px 2px}40%{translate:7px -2px}60%{translate:-5px 1px}80%{translate:4px 0}}
@keyframes gempa{0%,100%{transform:none}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-2px)}80%{transform:translate(4px,3px)}}
@keyframes stempel{0%{transform:translate(-50%,-50%) rotate(-8deg) scale(3);opacity:0}35%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) rotate(-8deg) scale(1);opacity:0}}
@keyframes geser{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes hore{0%,100%{transform:scale(1)}40%{transform:scale(1.06)}}
@keyframes naik{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-230%) scale(1)}}
@keyframes bintang{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
@keyframes pecah{0%{transform:scale(1.8)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button id="suara" type="button" aria-pressed="true">SUARA ON</button>
<canvas id="fx" aria-hidden="true"></canvas><div id="kilat" aria-hidden="true"></div>

<script>
var SOAL = [
/*0*/{j:"I",q:"Syekh Hamzah Fansuri menyampaikan ajaran tasawuf terutama melalui …",
 o:["syair-syair berbahasa Melayu","tafsir berbahasa Jawa beraksara pegon","kitab fikih berbahasa Arab","pengajian tetap di Masjidil Haram","hikayat tentang raja-raja Aceh"],
 p:"Hamzah Fansuri adalah penyair sufi dari Barus. Ia merintis syair Melayu, antara lain Syair Perahu."},
/*1*/{j:"A",k:"Raka rajin membuat konten dakwah berupa lagu dan puisi di media sosial. Seorang teman berkata, “Dakwah lewat lagu dan puisi itu kurang serius. Berhenti saja.”",
 q:"Jika dianalisis dari cara berdakwah Syekh Hamzah Fansuri, tanggapan yang paling tepat adalah …",
 o:["Raka dapat melanjutkan, sebab seni hanyalah sarana; yang wajib dijaga adalah kebenaran isi dan adabnya",
    "Raka sebaiknya berhenti, sebab dakwah yang sah hanya melalui ceramah dan kitab",
    "Raka boleh melanjutkan selama penontonnya banyak, sebab ukuran dakwah adalah popularitas",
    "Raka bebas memakai bentuk dan isi apa pun, sebab karya seni tidak terikat aturan",
    "Raka cukup menyalin syair Hamzah Fansuri agar pasti benar, tanpa perlu berkarya sendiri"],
 p:"Hamzah Fansuri memakai syair sebagai sarana dakwah. Yang diteladani adalah kreativitas memilih sarana tanpa mengorbankan isi dan adab."},
/*2*/{j:"I",q:"Tarjuman al-Mustafid karya Syekh Abdurrauf as-Singkili penting dalam sejarah karena merupakan …",
 o:["tafsir Al-Qur’an lengkap pertama berbahasa Melayu","tafsir Al-Qur’an pertama berbahasa Jawa beraksara pegon","kitab sejarah raja-raja dan tata pemerintahan Aceh","kitab fikih ibadah yang ditulis untuk Sultan Aceh","kumpulan syair tasawuf pertama di Nusantara"],
 p:"Tarjuman al-Mustafid adalah tafsir lengkap pertama dalam bahasa Melayu. Tafsir berbahasa Jawa pegon adalah karya Kiai Sholeh Darat."},
/*3*/{j:"A",k:"Saat diskusi kelas, seorang siswa memprotes: “Nuruddin ar-Raniri lahir di Gujarat, India. Ia tidak pantas dimasukkan sebagai ulama Nusantara.”",
 q:"Analisis yang paling tepat atas protes tersebut adalah …",
 o:["Kurang tepat, sebab kiprahnya sebagai mufti Aceh dan karya-karyanya yang berbahasa Melayu menjadi bagian sejarah Islam Nusantara",
    "Tepat, sebab seorang ulama dinilai dari tempat lahirnya, bukan dari tempat ia berkarya",
    "Kurang tepat, sebab ia wafat dan dimakamkan di Aceh sehingga otomatis menjadi ulama Nusantara",
    "Kurang tepat, sebab setiap ulama yang pernah singgah di Nusantara disebut ulama Nusantara",
    "Tepat, sebab ia menulis seluruh karyanya dalam bahasa Arab untuk pembaca di India"],
 p:"Ar-Raniri lahir di Ranir, Gujarat, tetapi mengabdi sebagai mufti Aceh pada masa Sultan Iskandar Tsani dan menulis karya berbahasa Melayu seperti Bustanus Salatin. Kontribusinya yang menentukan."},
/*4*/{j:"A",k:"Di grup kelas terjadi perdebatan panas tentang perbedaan tata cara ibadah. Dua kubu mulai saling menyebut sesat. Fajar, ketua kelas, ingin meneladani Syekh Abdurrauf as-Singkili yang dikenal menengahi perselisihan paham di Aceh dengan cara yang sejuk.",
 q:"Langkah Fajar yang paling sesuai dengan teladan tersebut adalah …",
 o:["mengajak kedua pihak menahan diri, menjelaskan bahwa perbedaan itu punya dasar dari para ulama, lalu membawa pertanyaannya kepada guru PAI",
    "membiarkan perdebatan berjalan, sebab perbedaan pendapat adalah urusan pribadi masing-masing",
    "memutuskan sendiri pendapat mana yang benar agar perdebatan cepat selesai",
    "mengeluarkan kubu yang anggotanya lebih sedikit supaya grup kembali tenang",
    "melarang semua pembahasan agama di grup kelas untuk seterusnya"],
 p:"Menengahi berarti meredakan, memberi pemahaman, dan merujuk kepada ahlinya. Membiarkan, memutuskan sepihak, atau membungkam bukan penyelesaian."},
/*5*/{j:"I",q:"Pasangan ulama dan karyanya yang tepat adalah …",
 o:["Syekh Abdus Samad al-Palimbani – Hidayatus Salikin","Syekh Nuruddin ar-Raniri – Tarjuman al-Mustafid","Syekh Nawawi al-Bantani – Faidhur Rahman","Kiai Sholeh Darat – Bustanus Salatin","Syekh Hamzah Fansuri – Sairus Salikin"],
 p:"Hidayatus Salikin dan Sairus Salikin adalah karya al-Palimbani. Tarjuman al-Mustafid karya as-Singkili, Faidhur Rahman karya Kiai Sholeh Darat, Bustanus Salatin karya ar-Raniri."},
/*6*/{j:"A",k:"Kak Salma kuliah di luar negeri dengan beasiswa. Ia berkata, “Karena aku jauh, aku tidak bisa berbuat apa-apa untuk kampung halamanku.” Padahal Syekh Abdus Samad al-Palimbani menetap di Haramain, tetapi menulis kitab berbahasa Melayu untuk umat di tanah airnya.",
 q:"Penilaian yang paling tepat terhadap pernyataan Kak Salma adalah …",
 o:["Kurang tepat, sebab jarak bukan penghalang; ia tetap dapat berkontribusi lewat karya, ilmu, dan jejaring yang dimilikinya",
    "Tepat, sebab kontribusi bagi tanah air hanya mungkin dilakukan oleh orang yang tinggal di dalamnya",
    "Kurang tepat, sebab ia seharusnya segera pulang dan meninggalkan kuliahnya demi kampung halaman",
    "Tepat, sebab tugas pelajar hanyalah belajar; berkontribusi adalah urusan setelah lulus",
    "Kurang tepat, sebab ia cukup sering mengunggah kerinduannya kepada kampung halaman"],
 p:"Al-Palimbani membuktikan bahwa orang yang jauh dari tanah air tetap dapat memberi manfaat nyata lewat karya dan ilmu."},
/*7*/{j:"A",k:"Dalam Hidayatus Salikin, al-Palimbani menyadur karya Imam al-Gazali ke bahasa Melayu, menyebutkan sumbernya, dan menambahkan penjelasan yang dibutuhkan masyarakatnya. Dinda menerjemahkan sebuah artikel asing untuk makalahnya, lalu mengumpulkannya sebagai tulisan sendiri.",
 q:"Perbedaan mendasar antara keduanya adalah …",
 o:["Al-Palimbani jujur menyebut sumber dan memberi nilai tambah, sedangkan Dinda menyembunyikan sumber sehingga tergolong plagiat",
    "Tidak ada perbedaan, sebab keduanya sama-sama memindahkan tulisan ke bahasa lain",
    "Perbedaannya hanya pada bahasa tujuan yang dipakai masing-masing",
    "Dinda lebih baik, sebab sumber yang ia terjemahkan lebih baru",
    "Keduanya keliru, sebab karya ulama besar tidak boleh disadur ke bahasa lain"],
 p:"Kejujuran ilmiah adalah adab berilmu. Menyadur dengan menyebut sumber dan menambah penjelasan berbeda dengan mengakui karya orang lain."},
/*8*/{j:"I",q:"Syekh Nawawi al-Bantani digelari Sayyid Ulama al-Hijaz karena …",
 o:["keluasan ilmu dan banyaknya karya beliau diakui para ulama di Tanah Hijaz","beliau keturunan langsung penguasa Hijaz","beliau memimpin perlawanan bersenjata di Hijaz","beliau menjabat mufti resmi Kesultanan Banten","beliau ulama Nusantara pertama yang menunaikan haji"],
 p:"Gelar itu berarti pemimpin ulama Hijaz, diberikan karena kedalaman ilmu dan karya beliau yang lebih dari seratus kitab."},
/*9*/{j:"A",k:"Syekh Nawawi tidak kembali menetap di Banten. Namun murid-muridnya dari Nusantara pulang, lalu mendirikan pesantren dan menggerakkan umat. Kitab-kitabnya pun dikaji di pesantren sampai sekarang.",
 q:"Dari fakta tersebut, pengaruh terbesar Syekh Nawawi bagi Indonesia paling tepat dijelaskan sebagai …",
 o:["pengaruh keilmuan yang menyebar lewat kitab dan murid-muridnya, meskipun beliau sendiri tinggal di Makkah",
    "pengaruh politik, karena beliau memimpin langsung perlawanan rakyat Banten dari Makkah",
    "pengaruh ekonomi, karena beliau membuka jalur dagang antara Banten dan Hijaz",
    "pengaruh yang terbatas, karena ilmunya hanya dinikmati penduduk Makkah",
    "pengaruh simbolis, yakni mengharumkan nama Banten tanpa dampak nyata di tanah air"],
 p:"Ilmu yang ditulis dan diajarkan terus hidup melampaui tempat dan zaman. Itulah pengaruh keilmuan Syekh Nawawi."},
/*10*/{j:"A",k:"Bima baru saja menjuarai olimpiade sains. Sejak itu ia sering meremehkan jawaban temannya dan enggan mengajari mereka. “Belajar saja sendiri,” katanya. Syekh Nawawi justru dikenal semakin rendah hati dan giat mengajar ketika ilmunya semakin luas.",
 q:"Masalah utama pada sikap Bima adalah …",
 o:["ia memisahkan ilmu dari adab, padahal ilmu semestinya membuatnya rendah hati dan mau berbagi",
    "ia belum cukup berprestasi sehingga memang belum pantas mengajari orang lain",
    "ia terlalu banyak belajar sehingga tidak punya waktu untuk bergaul",
    "tidak ada masalah, sebab orang berilmu wajar mendapat kedudukan lebih tinggi",
    "masalahnya ada pada teman-temannya yang iri terhadap prestasi Bima"],
 p:"Teladan Syekh Nawawi: ilmu yang bertambah harus diiringi tawaduk dan semangat mengajarkan."},
/*11*/{j:"I",q:"Tafsir Faidhur Rahman karya Kiai Sholeh Darat ditulis dengan …",
 o:["bahasa Jawa dengan aksara Arab (pegon)","bahasa Melayu dengan aksara Arab (Jawi)","bahasa Arab dengan terjemahan Jawa","bahasa Jawa dengan aksara Latin","bahasa Jawa dengan aksara hanacaraka"],
 p:"Faidhur Rahman berbahasa Jawa dengan aksara pegon, yaitu huruf Arab yang dipakai untuk menulis bahasa Jawa."},
/*12*/{j:"A",k:"Pada masa penjajahan, usaha menerjemahkan Al-Qur’an dicurigai dan dihalangi. Kiai Sholeh Darat tetap menulis tafsir berbahasa Jawa, tetapi dengan aksara pegon yang akrab bagi santri dan tidak dipahami penjajah.",
 q:"Analisis yang paling tepat atas pilihan Kiai Sholeh Darat adalah …",
 o:["strategi cerdas untuk tetap mencerdaskan umat dengan bahasa mereka tanpa mengorbankan tujuan dakwah",
    "bentuk ketundukan kepada penjajah karena beliau tidak berani memakai huruf Latin",
    "kebetulan saja, sebab beliau tidak menguasai aksara selain pegon",
    "upaya merahasiakan ilmu agar hanya dikuasai kalangan santri",
    "penolakan terhadap bahasa Arab sebagai bahasa ilmu agama"],
 p:"Beliau menyiasati hambatan tanpa meninggalkan tujuan: masyarakat Jawa tetap dapat memahami Al-Qur’an."},
/*13*/{j:"A",k:"Di sebuah sekolah, pengurus Rohis yang berlatar belakang NU dan Muhammadiyah berselisih soal tata cara kegiatan dan mulai enggan bekerja sama. Padahal K.H. Hasyim Asy’ari dan K.H. Ahmad Dahlan pernah berguru kepada guru yang sama, Kiai Sholeh Darat.",
 q:"Kesimpulan paling tepat yang dapat ditarik dari fakta sejarah itu untuk kasus Rohis adalah …",
 o:["perbedaan cara berjuang tidak menghapus persaudaraan dan sumber ilmu yang sama, sehingga kerja sama tetap perlu dijaga",
    "salah satu organisasi pasti telah menyimpang dari ajaran gurunya",
    "kedua organisasi sebaiknya dilebur menjadi satu agar tidak ada lagi perbedaan",
    "perbedaan itu membuktikan sang guru gagal menyatukan murid-muridnya",
    "Rohis sebaiknya dibagi dua supaya tiap kelompok berjalan sendiri-sendiri"],
 p:"Dua murid dari guru yang sama menempuh jalan perjuangan berbeda dan sama-sama berjasa bagi umat. Perbedaan bukan alasan memutus kerja sama."},
/*14*/{j:"I",q:"Urutan perjalanan hidup Syekh Yusuf al-Makassari yang benar adalah …",
 o:["Gowa → menuntut ilmu ke Haramain → mufti Banten → diasingkan ke Sri Lanka → Afrika Selatan",
    "Gowa → mufti Banten → menuntut ilmu ke Haramain → Afrika Selatan → Sri Lanka",
    "Gowa → menuntut ilmu ke Haramain → mufti Aceh → Sri Lanka → Afrika Selatan",
    "Banten → Gowa → Sri Lanka → menuntut ilmu ke Haramain → Afrika Selatan",
    "Gowa → diasingkan ke Sri Lanka → Haramain → mufti Banten → Afrika Selatan"],
 p:"Syekh Yusuf lahir di Gowa, belajar hingga Haramain, menjadi mufti Banten, lalu diasingkan ke Sri Lanka dan akhirnya ke Afrika Selatan."},
/*15*/{j:"A",k:"Setelah diasingkan ke Sri Lanka, Syekh Yusuf tetap menulis, mengajar, dan dikunjungi jemaah haji Nusantara yang singgah. Beberapa tahun kemudian Belanda memindahkannya lebih jauh lagi, ke Tanjung Harapan di Afrika Selatan.",
 q:"Alasan paling logis di balik pemindahan itu adalah …",
 o:["di Sri Lanka pengaruhnya terhadap Nusantara belum terputus, sehingga Belanda ingin menjauhkannya lagi",
    "Belanda ingin memberinya tempat yang lebih nyaman sebagai bentuk penghormatan",
    "Syekh Yusuf sendiri meminta dipindahkan agar dapat berdakwah di Afrika",
    "Sri Lanka telah direbut Inggris sehingga semua tahanan Belanda dipindahkan",
    "masa hukumannya di Sri Lanka telah selesai dan ia dibebaskan ke Afrika"],
 p:"Pengasingan pertama gagal memutus pengaruhnya. Karena itu ia dijauhkan lagi. Di Afrika Selatan pun beliau tetap berdakwah."},
/*16*/{j:"A",k:"Dita mengikuti pertukaran pelajar ke negara tempat ia menjadi satu-satunya muslim di sekolahnya. Karena merasa asing, ia mulai meninggalkan salat supaya “lebih diterima” teman-temannya.",
 q:"Sikap yang paling sesuai dengan teladan Syekh Yusuf di pengasingan adalah …",
 o:["tetap menjaga ibadah, berakhlak baik, dan terbuka bergaul sehingga keislamannya dikenal lewat teladan",
    "menyembunyikan identitasnya sampai pulang, sebab diterima dalam pergaulan lebih utama",
    "menjaga ibadah dengan cara menjauhi semua teman yang berbeda agama",
    "mengajak teman-temannya berdebat soal agama sampai mereka mengakui kebenaran Islam",
    "meminta segera dipulangkan karena lingkungan itu tidak mendukung ibadahnya"],
 p:"Syekh Yusuf tetap teguh dan justru dihormati masyarakat setempat. Istikamah tidak berarti menutup diri atau memaksa orang lain."},
/*17*/{j:"I",q:"Ulama disebut waratsatul anbiya’. Maksud ungkapan ini adalah ulama …",
 o:["mewarisi ilmu para nabi serta tugas membimbing umat, bukan harta atau kenabian","mewarisi kedudukan kenabian setelah Nabi Muhammad saw. wafat","merupakan keturunan langsung para nabi","berhak menetapkan syariat baru sesuai kebutuhan zaman","mewarisi kekuasaan pemerintahan atas umat Islam"],
 p:"Para nabi mewariskan ilmu. Ulama meneruskan tugas mengajarkan dan membimbing, bukan menerima wahyu atau membuat syariat baru."},
/*18*/{j:"A",k:"Hamzah Fansuri bersyair dalam bahasa Melayu. As-Singkili menafsirkan Al-Qur’an dalam bahasa Melayu. Kiai Sholeh Darat menulis tafsir berbahasa Jawa pegon. Syekh Nawawi menulis dalam bahasa Arab dan kitabnya dibaca di berbagai negeri.",
 q:"Kesimpulan paling tepat dari pola tersebut adalah …",
 o:["para ulama memilih bahasa dan media sesuai sasaran dakwahnya; isinya tetap, cara penyampaiannya menyesuaikan",
    "bahasa daerah lebih utama daripada bahasa Arab untuk mempelajari ilmu agama",
    "setiap ulama hanya menguasai satu bahasa sehingga menulis dengan bahasa itu saja",
    "karya berbahasa Arab selalu lebih tinggi nilainya daripada karya berbahasa daerah",
    "pilihan bahasa ditentukan oleh penguasa setempat, bukan oleh ulama itu sendiri"],
 p:"Sasaran dakwah menentukan bahasa dan media. Itulah kebijaksanaan dakwah para ulama Nusantara."},
/*19*/{j:"A",k:"Guru PAI meminta kelas membuat proyek “Meneladani Ulama Nusantara”. Proyek itu harus mencerminkan keteladanan mereka secara utuh: semangat berilmu, berkarya, dan memberi manfaat bagi orang lain.",
 q:"Usulan proyek yang paling memenuhi tujuan tersebut adalah …",
 o:["menulis ringkasan materi dengan bahasa yang mudah dipahami, mencantumkan sumbernya, lalu membagikannya kepada adik kelas",
    "menghafal nama, tahun lahir, dan judul kitab semua ulama lalu menyetorkannya",
    "membuat poster foto makam para ulama untuk dipajang di dinding kelas",
    "mengunggah kutipan ulama setiap hari tanpa perlu memeriksa sumbernya",
    "mengadakan lomba cerdas cermat dengan hadiah bagi yang menjawab paling cepat"],
 p:"Meneladani berarti melakukan: belajar sungguh-sungguh, menghasilkan karya yang jujur sumbernya, dan membagikan manfaatnya."}

   p:"Gelar Sayyid Ulama al-Hijaz berarti pemimpin ulama Hijaz. Gelar itu lahir dari pengakuan atas kedalaman ilmu dan karya beliau yang ditulis dalam bahasa Arab, bukan dari jabatan atau keturunan."},
9:{o:["Pengaruh keilmuan: gagasannya sampai ke tanah air melalui kitab yang dikaji dan murid-murid yang pulang mengajar.",
      "Pengaruh keilmuan: ia rutin pulang ke Banten untuk mengajar langsung di pesantren-pesantren yang didirikannya sendiri.",
      "Pengaruh keilmuan: kitab-kitabnya yang berbahasa Jawa memudahkan santri memahami ajaran Islam tanpa guru.",
      "Pengaruh politik: ia mengatur strategi perlawanan rakyat Banten melalui murid-murid yang dikirimnya pulang.",
      "Pengaruh sosial: ia membiayai pendirian banyak pesantren di tanah air dari hasil mengajar di Masjidil Haram."],
   p:"Kasusnya menyebut beliau tidak kembali menetap di Banten. Pengaruhnya mengalir lewat kitab berbahasa Arab yang dikaji di pesantren dan lewat murid-murid yang pulang mengajar."},
10:{o:["Ia memisahkan ilmu dari adab, padahal ilmu semestinya membuatnya makin rendah hati dan mau berbagi.",
       "Ia terlalu cepat merasa cukup, padahal ia semestinya mengejar prestasi lebih tinggi dulu sebelum mengajari teman.",
       "Ia salah memilih kata, padahal meremehkan jawaban teman boleh saja asalkan disampaikan dengan lebih halus.",
       "Ia lupa bahwa prestasinya milik sekolah, sehingga ia wajib mengajari teman demi nama baik sekolahnya.",
       "Ia kurang pandai menjelaskan, padahal orang berilmu tidak wajib mengajar bila memang tidak berbakat."],
   p:"Teladan Syekh Nawawi: ilmu yang bertambah diiringi tawaduk dan semangat mengajarkan. Masalah Bima bukan soal kata-kata, bakat, atau nama sekolah, melainkan ilmu yang tidak membuahkan adab."},
12:{o:["Siasat cerdas: umat tetap dapat memahami Al-Qur’an dalam bahasanya, sementara penjajah tidak mudah membacanya.",
       "Siasat cerdas: tafsir itu sengaja dibuat sulit dibaca agar hanya santri terpilih yang dapat mempelajarinya.",
       "Sikap hati-hati: beliau menunda dakwahnya sampai penjajah mau mengizinkan Al-Qur’an diterjemahkan ke dalam bahasa Jawa.",
       "Pelestarian budaya: tujuan utamanya menjaga aksara pegon agar tidak tergeser oleh huruf Latin.",
       "Perlawanan terbuka: beliau menantang larangan penjajah secara terang-terangan dengan menyebarkan tafsirnya."],
   p:"Tujuannya mencerdaskan umat, dan pegon adalah caranya menyiasati hambatan. Beliau tidak menunda dakwah, tidak merahasiakan ilmu, dan tidak pula melawan secara terbuka."},
13:{o:["Berbeda jalan perjuangan tidak memutus persaudaraan; gurunya sama, jadi kerja sama tetap perlu dijaga.",
       "Berbeda jalan perjuangan itu wajar; karena itu tiap kelompok sebaiknya membuat kegiatan sendiri agar tidak bergesekan.",
       "Berbeda jalan perjuangan itu wajar; yang perlu dicari adalah kelompok mana yang paling setia pada ajaran sang guru.",
       "Karena bersumber dari guru yang sama, kedua kelompok semestinya menyamakan seluruh tata cara agar tidak berbeda lagi.",
       "Karena bersumber dari guru yang sama, perbedaan di antara keduanya sebenarnya tidak ada dan tidak perlu dibahas."],
   p:"Dua murid dari guru yang sama menempuh jalan berbeda dan sama-sama berjasa. Perbedaan itu nyata dan tidak harus dihapus, tetapi juga bukan alasan untuk berjalan sendiri-sendiri atau saling mengadili."},
15:{o:["Di Sri Lanka ia masih terhubung dengan jemaah haji Nusantara, sehingga pengaruhnya belum terputus.",
       "Di Sri Lanka ia memimpin pemberontakan bersenjata penduduk setempat terhadap benteng-benteng milik Belanda.",
       "Di Sri Lanka ia telah menyelesaikan masa hukumannya, sehingga dipindahkan sebagai orang bebas.",
       "Di Sri Lanka kekuasaan Belanda mulai direbut Inggris, sehingga para tahanan harus dipindahkan.",
       "Di Sri Lanka ia hampir dibebaskan armada Kesultanan Gowa yang datang untuk menjemputnya."],
   p:"Kasusnya menyebut ia tetap menulis, mengajar, dan dikunjungi jemaah haji. Pengasingan pertama gagal memutus pengaruhnya, maka ia dijauhkan lagi."},
16:{o:["Tetap menjaga salat dan akhlaknya, sambil bergaul terbuka agar teman-temannya mengenal Islam dari perilakunya.",
       "Tetap menjaga salat, sambil rutin mengajak teman-temannya berdiskusi sampai mereka mengakui kebenaran Islam.",
       "Tetap menjaga salat, tetapi membatasi pergaulan hanya dengan sesama muslim dari sekolah lain agar imannya aman.",
       "Menjaga salat secara sembunyi-sembunyi dan menutupi keislamannya agar pertemanannya tidak terganggu.",
       "Menunda salat sampai tiba di asrama lalu mengerjakan semuanya sekaligus agar tetap bisa bergaul seperti biasa."],
   p:"Syekh Yusuf tetap teguh beribadah dan dihormati masyarakat setempat karena akhlaknya. Istikamah tidak berarti menutup diri, menyembunyikan identitas, atau memaksa orang lain."},
17:{o:["mewarisi ilmu para nabi dan bertugas menyampaikannya kepada umat",
       "mewarisi wahyu para nabi dan bertugas menyampaikannya kepada umat",
       "mewarisi ilmu para nabi dan berwenang menetapkan syariat yang baru",

   p:"Yang diwariskan para nabi adalah ilmu. Ulama tidak menerima wahyu, tidak membuat syariat baru, dan tidak terjaga dari salah."},
18:{o:["Ulama menyesuaikan bahasa dan media dengan sasaran dakwahnya, sementara isi ajarannya tetap sama.",
       "Ulama menyesuaikan isi ajaran dengan budaya sasaran dakwahnya, sementara bahasanya tetap sama.",
       "Ulama menyesuaikan bahasa dengan kehendak penguasa setempat yang memesan karya-karya tersebut.",
       "Ulama memakai bahasa daerah karena pada masa itu bahasa Arab belum dikuasai ulama Nusantara.",
       "Ulama memakai bahasa daerah bagi orang awam, sebab ilmu yang mendalam hanya untuk yang paham Arab."],
   p:"Yang berubah adalah bahasa dan medianya, bukan isi ajaran. Para ulama itu fasih berbahasa Arab; mereka memilih bahasa sesuai siapa yang ingin dijangkau."},
14:{o:["Gowa → menuntut ilmu ke Haramain → mufti Banten → diasingkan ke Sri Lanka → Afrika Selatan",

19:{o:["Menulis ringkasan materi dengan bahasa mudah, mencantumkan sumbernya, lalu membagikannya kepada adik kelas.",

      var temu=ta.value.match(/JU5-[A-Za-z0-9_-]+\.[a-z0-9]+/g)||[],baru=0,rusak=0,k=muat(K_GURU,[]);
      temu.forEach(function(c){if(!bacaKode(c)){rusak++;return}if(k.indexOf(c)<0){k.push(c);baru++}});
      simpan(K_GURU,k);
      guruPanel(temu.length?baru+" laporan baru ditambahkan"+(rusak?", "+rusak+" kode tidak sah ditolak":"")+(temu.length-baru-rusak>0?", "+(temu.length-baru-rusak)+" sudah ada":"")+".":"Tidak ada kode laporan dalam teks itu.")}})]));

  if(!data.length){app.appendChild(h("section",{cls:"kitab"},[h("p",{txt:"Belum ada laporan. Minta siswa menekan “Salin laporan untuk guru” di akhir permainan, lalu tempel kiriman mereka di atas."})]))}
  else{
    var nilai=data.map(function(r){return r.nilai}),rata=Math.round(nilai.reduce(function(a,b){return a+b},0)/nilai.length*10)/10,tuntas=nilai.filter(function(v){return v>=kkm}).length;
    var iK=h("input",{id:"kkm",inputMode:"numeric",maxLength:3,value:String(kkm),style:"max-width:90px",onchange:function(){var v=parseInt(iK.value,10);if(v>=0&&v<=100){simpan("jejakUlama.kkm",v);guruPanel()}}});
    var tb=h("table");tb.appendChild(h("tr",null,[["Kelas",""],["Abs","n"],["Nama",""],["Nilai","n"],["Tepat","n"],["Poin","n"],["Darurat","n"],["Menit","n"],["Ke","n"],["",""]].map(function(x){return h("th",{cls:x[1],txt:x[0]})})));
    data.forEach(function(r){tb.appendChild(h("tr",null,[
      h("td",{txt:r.kelas}),h("td",{cls:"n",txt:r.absen||"-"}),h("td",{txt:r.nama}),
      h("td",{cls:"n "+(r.nilai>=kkm?"tuntas":"kurang"),txt:String(r.nilai)}),h("td",{cls:"n",txt:r.benar+"/"+SOAL.length}),
      h("td",{cls:"n",txt:ribuan(r.poin)}),h("td",{cls:"n",txt:String(r.karam)}),h("td",{cls:"n",txt:String(Math.round(r.durasi/60))}),h("td",{cls:"n",txt:String(r.ke)}),
      h("td",null,[h("button",{type:"button","aria-label":"Hapus laporan "+r.nama,txt:"Hapus",onclick:function(){simpan(K_GURU,muat(K_GURU,[]).filter(function(c){return c!==r.kode}));guruPanel()}})])]))});
    var sal=h("button",{cls:"utama",type:"button",txt:"Salin rekap nilai",onclick:function(){
      salin("Kelas\tAbsen\tNama\tNilai\tTepat\tPoin\tDarurat\tMenit\tPercobaan\n"+data.map(function(r){return [r.kelas,r.absen,r.nama,r.nilai,r.benar,r.poin,r.karam,Math.round(r.durasi/60),r.ke].join("\t")}).join("\n"),sal,"Rekap tersalin, tempel di Excel atau Sheets")}});
    var yakin=false,hp=h("button",{cls:"sekunder",type:"button",txt:"Hapus semua laporan",onclick:function(){if(!yakin){yakin=true;hp.textContent="Tekan sekali lagi untuk menghapus";return}simpan(K_GURU,[]);guruPanel()}});
    app.appendChild(h("section",{cls:"kitab"},[h("h2",{txt:"Rekap kelas"}),
      h("div",{cls:"ringkas"},[
        h("div",null,[h("b",{txt:String(data.length)}),h("span",{txt:"laporan"})]),
        h("div",null,[h("b",{txt:String(rata).replace(".",",")}),h("span",{txt:"rata-rata"})]),
        h("div",null,[h("b",{txt:tuntas+"/"+data.length}),h("span",{txt:"tuntas"})])]),
      h("p",{txt:"Tertinggi "+Math.max.apply(null,nilai)+", terendah "+Math.min.apply(null,nilai)+"."}),
      h("label",null,["Batas tuntas (KKM)",iK]),
      h("div",{cls:"gulung"},[tb]),sal,hp]));

    var butir=h("div",{cls:"butir"});
    SOAL.forEach(function(s,i){var c=data.filter(function(r){return r.mask&(1<<i)}).length,pr=Math.round(c/data.length*100),pel="";
      PEL.forEach(function(p){if(p.s.indexOf(i)>=0)pel=p.n});
      butir.appendChild(h("div",{cls:"b"},[
        h("div",{cls:"atas"},[h("span",{txt:(i+1)+". "+pel+" · "+(s.j==="I"?"ingatan":"analisis")}),h("span",{txt:pr+"% tepat"})]),
        h("div",{cls:"batang"},[h("i",{cls:pr<50?"sulit":"",style:"width:"+pr+"%"})]),
        h("div",{txt:s.q}),h("div",{cls:"kunci",txt:"Kunci: "+s.o[0]})]))});
    app.appendChild(h("section",{cls:"kitab"},[h("h2",{txt:"Analisis butir soal"}),h("p",{txt:"Batang merah menandai soal yang dijawab tepat oleh kurang dari separuh siswa."}),butir]));
  }
  app.appendChild(h("p",{cls:"redup"},[h("a",{href:"#siswa",txt:"Ke tampilan siswa"})]));
}


/* ================= RUTE & MULAI ================= */
function arah(){
  if(location.hash==="#guru"){if(guruMasuk)guruPanel();else guruGerbang();return}
  if((S.layar==="main"||S.layar==="tiba")&&S.awal)tantangan();
  else if(S.layar==="terbang"&&S.awal)terbang();
  else if(S.layar==="hasil"&&S.kode)hasil();
  else if(S.layar==="ringkas"&&S.awal){if(S.selesai>=PEL.length)selesai();else terbang()}
  else beranda();
}
function boot(d){if(d&&d.layar)S=d;arah()}
window.addEventListener("hashchange",arah);
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot){try{hot.snapshot(function(){return S})}catch(e){}}
if(hot&&hot.ready){hot.ready(boot)}else{boot((hot&&hot.data)||{})}
</script>
